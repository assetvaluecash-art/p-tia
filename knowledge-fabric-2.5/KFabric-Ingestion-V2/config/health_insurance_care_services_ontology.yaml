block_categories:
- name: Requirement
  description: Functional or non-functional requirement statement. 'The system shall...', capability descriptions, constraints.
  maps_to_node: Requirement
- name: Process
  description: Concrete, named business process or operational procedure with identifiable steps, actors, systems, or inputs/outputs.
    BPMN activities, SOPs, transactional workflows. NOT abstract methodology descriptions, conceptual frameworks, lifecycle
    phase names, or sales narratives about approaches.
  maps_to_node: Process
- name: Rule
  description: Business rule with explicit conditional outcome — both condition AND consequence stated. If X then Y, unless
    X apply Y, when X triggers Y. Threshold constraints without a stated consequence are Requirements not Rules.
  maps_to_node: Rule
- name: Control
  description: Operational control, compliance gate, SOX control, audit checkpoint. Mechanisms that enforce rules or mitigate
    risks.
  maps_to_node: Control
- name: Regulation
  description: External regulatory mandate, standard, or guideline. Basel III, OFAC, GDPR, PCI-DSS, RBI circular.
  maps_to_node: Regulation
- name: TestCase
  description: Individual test procedure including manual test scripts, UI navigation test steps, and automated test definitions.
    Blocks with preconditions, numbered steps (Navigate To, Click, Enter, Select, Verify), and expected results. Xray, Zephyr,
    and Excel-based test sheets. ANY block describing how to manually or automatically execute a test belongs here — NOT in
    Process. Individual UI steps (Navigate To, Click, Enter) are test steps within the TestCase node, not separate Process
    entities.
  maps_to_node: TestCase
- name: Defect
  description: Bug report, defect description, issue record from a defect tracking system.
  maps_to_node: Defect
- name: Incident
  description: Production incident record, outage report, operational issue.
  maps_to_node: Incident
- name: UserStory
  description: User story, feature request, change request. 'As a [role], I want [goal]...' or change descriptions.
  maps_to_node: UserStory
- name: AcceptanceCriteria
  description: Acceptance criterion tied to a requirement. Given/When/Then, verification conditions, definition of done.
  maps_to_node: AcceptanceCriteria
- name: TechnicalSystem
  description: Named software application, platform, module, or service described from a business or integration perspective.
    System overview pages, application capability descriptions, system-to-system interface narratives. The block is primarily
    ABOUT a system — what it does, what processes it supports, how it integrates. Distinguished from TechnicalSpec which contains
    machine-readable interface definitions.
  maps_to_node: System
- name: TechnicalSpec
  description: Machine-readable interface definitions — API contracts, OpenAPI/Swagger/WSDL schemas, endpoint definitions,
    message format specifications. The block IS the interface contract not a narrative about a system. Extract the named API
    or owning service as a System node (e.g. Loan API from LOAN.API.3). Do not extract operationIds or HTTP methods as System.
    System narrative descriptions go to TechnicalSystem.
  maps_to_node: System
- name: TechnicalOps
  description: Batch job definitions, ETL schedules, cron jobs, automated event handlers, configuration parameters, feature
    flags, deployment procedures, environment settings, operational runbooks. Also includes system lifecycle steps like approval
    events, status transitions, and scheduled data refreshes that are NOT user-facing business processes.
  maps_to_node: _SKIP_KG
- name: Reference
  description: Glossary terms, definitions, acronyms, configurable parameters, reference material.
  maps_to_node: _SKIP_KG
- name: Diagram
  description: Visual content — flowchart, architecture, BPMN, form image. Vision IE extracts entities into KG.
  maps_to_node: _SKIP_KG
- name: FormCapture
  description: Data capture forms, input screens, KYC forms, application forms, Figma screen mockups. Contains field-value
    pairs and validation rules. ALSO includes system screen guides and field listing documents — Temenos screen descriptions
    listing visible fields (Username, Password, Arrangement, Status, Balance), screen layout documentation, and any block
    that describes what fields appear on a system screen. Field names listed within a screen description are form fields,
    not System entities.
  maps_to_node: FormCapture
- name: Narrative
  description: General prose with no classifiable structure. Last resort — use only when no other category fits.
  maps_to_node: _SKIP_KG
node_types:
- name: DomainRoot
  layer: domain_structure
  description: Customer-scoped domain anchor beneath CustomerRoot. Industry is metadata and never a graph root.
  name_pattern: Exact domain key (snake_case)
  examples:
  - corporate_commercial
  - consumer_retail
- name: ProductLine
  layer: domain_structure
  description: Major business line within a domain. Hub node for graph traversal.
  name_pattern: Title Case, business name as known to the bank
  examples:
  - SME Lending
  - Trade Finance
  - Cash Management
- name: Function
  layer: domain_structure
  description: Business function within a product line. Groups related processes and requirements.
  name_pattern: Title Case, verb-noun phrase preferred
  examples:
  - Loan Origination
  - Loan Servicing
  - Letter of Credit
- name: SubFunction
  layer: domain_structure
  description: Specific capability within a function. Leaf of the pre-seeded spine.
  name_pattern: Title Case
  examples:
  - Credit Assessment
  - Collateral Valuation
  - Repayment Processing
- name: Requirement
  layer: context
  description: Functional or non-functional requirement statement. Core node for coverage and compliance tracing.
  name_pattern: ID when present in source (FR-xx, REQ-xxx). Else short descriptive phrase ≤80 chars.
  ie_examples:
  - block_text: 'FR-04: The system shall auto-generate a repayment schedule (EMI or bullet) upon loan booking, reflecting
      selected interest type, tenor, and repayment frequency.'
    block_category: Requirement
    spine_node: Repayment Processing
    entities:
    - type: Requirement
      value: FR-04
      description: The system shall auto-generate a repayment schedule (EMI or bullet) upon loan booking, reflecting selected
        interest type, tenor, and repayment frequency.
      confidence: 0.95
    - type: Process
      value: Loan Booking
      confidence: 0.9
    - type: Process
      value: EMI Schedule Generation
      confidence: 0.85
    relationships:
    - from_type: Requirement
      from_value: FR-04
      rel_type: IMPACTS
      to_type: Process
      to_value: Loan Booking
    - from_type: Requirement
      from_value: FR-04
      rel_type: IMPACTS
      to_type: Process
      to_value: EMI Schedule Generation
  - block_text: The system must validate that collateral value exceeds 120% of loan amount before approval can proceed.
    block_category: Requirement
    spine_node: Collateral Valuation
    entities:
    - type: Requirement
      value: Collateral Validation Threshold
      description: The system must validate that collateral value exceeds 120% of loan amount before approval can proceed.
      confidence: 0.95
    - type: Process
      value: Loan Approval
      confidence: 0.9
    relationships:
    - from_type: Requirement
      from_value: Collateral Validation Threshold
      rel_type: IMPACTS
      to_type: Process
      to_value: Loan Approval
  anti_examples:
  - Do NOT extract narrative prose or section introductions as Requirement
  - Do NOT extract section headings like '3. Functional Requirements' as Requirement
  - Do NOT discard the descriptive text when an entity has an ID. Preserve the ID as `value` and extract the human-readable
    statement into `description`.
  - 'Do NOT replace the canonical entity ID with `ID : description`; `value` must remain the stable identifier used for graph
    linking (e.g. FR-04).'
  - Do NOT invent a description. It must be grounded in the source block.
  - Do NOT duplicate the identifier inside description.
- name: Process
  layer: context
  description: Named, executable business process or workflow with concrete operational steps, system interactions, or defined
    inputs/outputs. Must be a specific process that an organization performs — not an abstract concept, methodology phase,
    lifecycle stage name, or sales description of an approach.
  name_pattern: Title Case, descriptive verb-noun phrase ≤80 chars
  evidence_gate:
    enabled: true
    min_evidence_score: 3
    step_keywords:
    - step
    - then
    - after
    - before
    - first
    - next
    - followed by
    - sequence
    - procedure
    - workflow
    - navigate
    - click
    - enter
    - select
    actor_keywords:
    - manager
    - officer
    - agent
    - user
    - team
    - analyst
    - clerk
    - applicant
    - customer
    - borrower
    - maker
    - checker
    - approver
    - administrator
    system_keywords:
    - system
    - module
    - screen
    - portal
    - application
    - database
    - API
    - interface
    - core banking
    - T24
    - LOS
    - CRM
    - ERP
    - SWIFT
    action_keywords:
    - execute
    - process
    - submit
    - validate
    - create
    - generate
    - verify
    - approve
    - reject
    - initiate
    - configure
    - disburse
    - accrue
    - settle
    - book
    - capture
    - assess
    - classify
    - compute
    - reconcile
    outcome_keywords:
    - produces
    - results in
    - generates
    - completes
    - approved
    - booked
    - disbursed
    - settled
    - report produced
    - outcome
    - output
    exclusion_keywords:
    - batch
    - scheduled job
    - nightly run
    - daily run
    - eod processing
    - eom processing
    - accrual run
    - posting run
    - background job
    - automated sweep
    - scheduled task
    - navigate to
    - click on
    - enter the field
    - pre-requisites
    - pre-condition
    - test step
    - login and approve
  ie_examples:
  - block_text: 'Loan disbursement initiation: The maker enters the disbursement instruction in LOS_Core specifying account
      number, amount, and value date. The system validates available limit against sanctioned amount. On success the maker
      submits for checker review. The checker approves in LOS_Core. On dual approval the disbursement request is transmitted
      to Core Banking for fund transfer execution.'
    block_category: Process
    spine_node: Loan Disbursement
    entities:
    - type: Process
      value: Loan Disbursement Initiation
      confidence: 0.95
    - type: System
      value: LOS_Core
      confidence: 0.9
    - type: System
      value: Core Banking
      confidence: 0.88
    - type: Actor
      value: Maker
      confidence: 0.85
    - type: Actor
      value: Checker
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Loan Disbursement Initiation
      rel_type: USES
      to_type: System
      to_value: LOS_Core
    - from_type: Actor
      from_value: Maker
      rel_type: PERFORMS
      to_type: Process
      to_value: Loan Disbursement Initiation
  anti_examples:
  - Do NOT extract flowchart box labels like 'Check band' as Process — these are diagram elements
  - Do NOT extract state names like 'Rejected' or 'Approved' as Process — these are states
  - Do NOT extract data values like 'AggressiveProfile' as Process
  - Do NOT extract abstract methodology stages like 'Requirement Stage', 'Design Stage', 'Test Planning', 'Test Execution',
    'Test Design' as Process — these are methodology phases, not executable workflows
  - Do NOT extract sales or marketing descriptions of approaches, capabilities, or value propositions as Process
  - Do NOT extract lifecycle phase names (e.g., 'Planning Phase', 'Execution Phase') unless they describe concrete operational
    steps with actors and systems
  - Do NOT extract single-word abstract capabilities like 'Automation', 'Integration', 'Validation', 'Customization', 'Scale',
    or 'Governance' as Process — these are generic concepts
  - Do NOT extract product or tool feature names like 'Pulse Intelligence', 'Pulse Automation', 'Gateway Integration' as Process
    — these are software components, not business processes
  - Do NOT extract benefit descriptions or outcome phrases like 'Clarity & Testability', 'Faster Certification', 'Governed
    Coverage Creation', 'Risk-Based Validation' as Process
  - Do NOT extract SDLC activity labels like 'Risk Identification', 'System Impact Discovery', 'Historical Defect Intelligence'
    as Process unless the text describes a specific workflow with concrete steps, actors, and systems
  - 'Do NOT extract scheduled batch jobs, cron tasks, or automated events as Process — classify as TechnicalOps instead. Examples:
    ''Daily DPD Calculation Batch'', ''Monthly EMI Due Generation'', ''Benchmark Rate Refresh Job'', ''Interest Accrual Suspension
    Job'', ''End-of-Day Reconciliation'''
  - 'Do NOT extract system lifecycle events or state transitions as Process — classify as TechnicalOps. Examples: ''Approval
    Event'', ''Status Change'', ''File Upload Trigger'', ''Notification Dispatch'''
  - Do NOT extract SubFunction spine node names as Process entities — EMI Calculation, Eligibility Check, Disbursement, NAB
    Classification, Repayment Processing are pre-seeded SubFunction nodes. Set spine_node to the matching SubFunction instead.
  - Do NOT extract API method names or REST endpoint strings as Process — createConsumerLoan, cancelArrangement, LOAN.API.3
    PUT, POST /loans are API operations. Classify the block as TechnicalSpec.
- name: Rule
  layer: context
  description: Business rule with explicit conditional logic — if X then Y, unless X apply Y, when X triggers Y. BOTH condition
    AND consequence must be stated. Threshold constraints without a stated consequence are Requirements not Rules. For operational
    enforcement mechanisms use Control instead.
  name_pattern: Title Case or RULE-ID if present, descriptive ≤80 chars
  ie_examples:
  - block_text: 'Interest accrual ceases when account reaches 90+ DPD and is classified as Non-Accrual of Business (NAB).
      Repayment priority follows: Interest → Charges → Tax → Principal.'
    block_category: Rule
    spine_node: Interest Accrual
    entities:
    - type: Rule
      value: NAB Classification at 90 DPD
      confidence: 0.95
    - type: Rule
      value: Repayment Priority Order
      confidence: 0.9
    - type: Process
      value: Interest Accrual
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Interest Accrual
      rel_type: GOVERNED_BY
      to_type: Rule
      to_value: NAB Classification at 90 DPD
  - block_text: If a pricing override is submitted, the user must provide documented justification, and the system must log
      user ID, timestamp, old rate, new rate, and reason for the override.
    block_category: Rule
    entities:
    - type: Rule
      value: Pricing Override Justification
      confidence: 0.95
    - type: Process
      value: Pricing Override
      confidence: 0.9
    relationships:
    - from_type: Process
      from_value: Pricing Override
      rel_type: GOVERNED_BY
      to_type: Rule
      to_value: Pricing Override Justification
  anti_examples:
  - Do NOT extract narrative descriptions of policy background as Rule
  - Do NOT extract external regulations (Basel III, OFAC) as Rule — use Regulation
  - Do NOT extract operational controls (sanctions screening gate) as Rule — use Control
  - Do NOT extract threshold constraints as Rule when no consequence is stated — collateral must exceed 120% is a Requirement
    not a Rule
  - Do NOT extract process sequencing language as Rule — maker submits for checker approval is a Process step not a Rule
- name: Control
  layer: context
  description: Operational enforcement mechanism that mitigates risk or enforces rules. SOX controls, compliance gates, screening
    checks, audit checkpoints. Distinct from Rule (which states the logic) — Control is the mechanism that enforces it.
  name_pattern: Title Case, descriptive ≤80 chars
  ie_examples:
  - block_text: Real-time sanctions screening must execute on all outbound payments above $5,000. The screening control checks
      against OFAC SDN, UN, and EU sanctions lists. Flagged transactions are held pending compliance review.
    block_category: Control
    entities:
    - type: Control
      value: Real-Time Sanctions Screening
      confidence: 0.95
    - type: Process
      value: Outbound Payment Processing
      confidence: 0.9
    - type: Regulation
      value: OFAC SDN List
      confidence: 0.85
    relationships:
    - from_type: Control
      from_value: Real-Time Sanctions Screening
      rel_type: MITIGATES
      to_type: Process
      to_value: Outbound Payment Processing
    - from_type: Control
      from_value: Real-Time Sanctions Screening
      rel_type: ENFORCED_BY
      to_type: Regulation
      to_value: OFAC SDN List
  - block_text: 'KYC completion gate: No account can be activated until KYC verification status = COMPLETE and risk rating
      is assigned. This is a mandatory SOX control for new customer onboarding.'
    block_category: Control
    entities:
    - type: Control
      value: KYC Completion Gate
      confidence: 0.95
    - type: Process
      value: New Customer Onboarding
      confidence: 0.9
    relationships:
    - from_type: Control
      from_value: KYC Completion Gate
      rel_type: MITIGATES
      to_type: Process
      to_value: New Customer Onboarding
  anti_examples:
  - Do NOT extract business logic like 'if amount > $1M then escalate' as Control — that is a Rule
  - Do NOT extract external regulations as Control — use Regulation
- name: Regulation
  layer: context
  description: External regulatory mandate, industry standard, or compliance guideline. Basel III, OFAC, GDPR, PCI-DSS, RBI
    Master Circular, SOX. These are external to the bank and enforce Controls.
  name_pattern: 'Official name or abbreviation as commonly known: Basel III, OFAC, GDPR'
  ie_examples:
  - block_text: All capital adequacy calculations must comply with Basel III norms. The bank maintains a minimum CET1 ratio
      of 8% with a 2.5% conservation buffer as mandated by the central bank.
    block_category: Regulation
    entities:
    - type: Regulation
      value: Basel III
      confidence: 0.95
    - type: Process
      value: Capital Adequacy Calculation
      confidence: 0.9
    - type: Rule
      value: CET1 Minimum 8% Plus Conservation Buffer
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Capital Adequacy Calculation
      rel_type: COMPLIANT_WITH
      to_type: Regulation
      to_value: Basel III
    - from_type: Rule
      from_value: CET1 Minimum 8% Plus Conservation Buffer
      rel_type: ENFORCED_BY
      to_type: Regulation
      to_value: Basel III
  - block_text: PCI-DSS compliance requires encryption of cardholder data at rest and in transit. Annual penetration testing
      and quarterly vulnerability scans are mandatory.
    block_category: Regulation
    entities:
    - type: Regulation
      value: PCI-DSS
      confidence: 0.95
    - type: Control
      value: Cardholder Data Encryption
      confidence: 0.9
    relationships:
    - from_type: Control
      from_value: Cardholder Data Encryption
