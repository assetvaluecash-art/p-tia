      from_value: HI-CTRL-014
      rel_type: MITIGATES
      to_type: Process
      to_value: Member Eligibility Evaluation
      confidence: 0.92
- name: Regulation
  description: An external law, regulation, official standard, or model instrument explicitly cited by a source. Distinguish
    enacted jurisdiction-specific law from a model law or model regulation.
  name_pattern: Do not assume a model instrument is adopted law; do not infer applicable jurisdiction.
  examples:
  - NAIC Model 275
  - NAIC Model 900
  - IRS required minimum distribution rules
  reject_names:
  - regulation
  - compliance
  - insurance law
  anti_examples:
  - A model act/regulation must remain identified as a model unless the source establishes local adoption.
  - Do not infer jurisdiction or applicability from an industry topic.
  ie_examples:
  - scope:
      domain_id: annuities
