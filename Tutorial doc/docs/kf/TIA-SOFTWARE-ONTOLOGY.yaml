# Generated by tools/gen_kf_ontology.py from tia/kfontology.py; do not edit by hand (a test fails when it is out of date).
# Also served at GET /api/v1/graph/ontology. See docs/KF-BRIDGE.md section 5.
name: tia-software
version: gs-3
lane: software
domain_neutral: true
description: 'TIA''s software graph: services, endpoints, code, data, events, screens, API structure, tests and rules found in code. Not tied
  to a business domain; scoped by TIA tenant.'
node_types:
- name: TiaService
  tia_type: service
  layer: software_code
  description: A deployable service (one per analysed repository).
  properties:
  - service
  - repo
- name: TiaEndpoint
  tia_type: endpoint
  layer: software_code
  description: An HTTP API entry point a service exposes.
  properties:
  - method
  - route
  - path
  - repo
  - service
  - file
  - line
- name: TiaFunction
  tia_type: function
  layer: software_code
  description: A function or method (qualified name).
  properties:
  - name
  - repo
  - service
  - file
  - line
- name: TiaType
  tia_type: type
  layer: software_code
  description: A class, interface or record (for inheritance).
  properties:
  - name
  - kind
  - repo
  - file
  - line
- name: TiaSchema
  tia_type: schema
  layer: software_code
  description: A request or response body type declared in code or OpenAPI.
  properties:
  - name
  - repo
  - file
  - line
- name: TiaCallsite
  tia_type: callsite
  layer: software_code
  description: An outbound HTTP call in code (the consumer side of CONSUMES_API).
  properties:
  - repo
  - file
  - line
  - client_pkg
  - client_attr
- name: TiaTest
  tia_type: test
  layer: software_test
  description: An automated test in a repository.
  properties:
  - name
  - repo
  - file
  - line
- name: TiaContractRef
  tia_type: contract_ref
  layer: software_code
  description: A consumer contract declared in a repository whose code does not show the call.
  properties:
  - repo
  - service
  - file
- name: TiaRuntimeRef
  tia_type: runtime_ref
  layer: software_code
  description: A caller seen only in runtime telemetry (added to an analysis's own copy of the graph).
  properties:
  - service
  - repo
- name: TiaEntity
  tia_type: entity
  layer: software_data
  description: An ORM-mapped class (JPA, SQLAlchemy, Django).
  properties:
  - name
  - orm
  - table
  - database
  - repo
  - service
  - file
  - line
- name: TiaTable
  tia_type: table
  layer: software_data
  description: A database table.
  properties:
  - name
  - database
- name: TiaColumn
  tia_type: column
  layer: software_data
  description: A table column.
  properties:
  - database
  - table
  - column
- name: TiaMigration
  tia_type: migration
  layer: software_data
  description: A schema migration (Flyway, Liquibase, Alembic, Django, SQL).
  properties:
  - name
  - tool
  - repo
  - file
- name: TiaProcedure
  tia_type: procedure
  layer: software_data
  description: A stored procedure, view or trigger.
  properties:
  - name
  - kind
  - database
- name: TiaTopic
  tia_type: topic
  layer: software_events
  description: A message topic (Kafka).
  properties:
  - name
- name: TiaEventSchema
  tia_type: event_schema
  layer: software_events
  description: The schema of the messages on a topic.
  properties:
  - name
  - repo
  - file
  - line
- name: TiaListener
  tia_type: listener
  layer: software_events
  description: Code that consumes a topic.
  properties:
  - name
  - repo
  - file
  - line
- name: TiaApplication
  tia_type: application
  layer: software_ui
  description: The front end of a repository (all of its screens).
  properties:
  - name
  - frameworks
  - repo
  - service
- name: TiaScreen
  tia_type: screen
  layer: software_ui
  description: 'A page or screen: its route, component and framework.'
  properties:
  - name
  - route
  - component
  - framework
  - repo
  - file
- name: TiaElement
  tia_type: element
  layer: software_ui
  description: 'A UI element on a screen: tag and type, label, mandatory, input rules, dropdown values.'
  properties:
  - name
  - tag
  - input_type
  - label
  - mandatory
  - mandatory_source
  - repeated
  - repo
  - file
  - line
  - options
  - options_source
  - max_length
  - min_length
  - minimum
  - maximum
  - exclusive_minimum
  - exclusive_maximum
  - pattern
  - format
- name: TiaLocator
  tia_type: locator
  layer: software_ui
  description: 'One way to find an element when the application runs: CSS, XPath and Playwright forms, whether it is unique, and whether it is
    the one to use.'
  properties:
  - strategy
  - css
  - xpath
  - playwright
  - unique
  - best
  - rank
- name: TiaRequest
  tia_type: request
  layer: software_api
  description: 'What an endpoint accepts: its parameters and request body.'
  properties:
  - name
  - body_schema
  - repo
  - service
- name: TiaResponse
  tia_type: response
  layer: software_api
  description: 'What an endpoint answers: body schema, success status, shape, error statuses.'
  properties:
  - name
  - schema
  - success_status
  - shape
  - error_statuses
  - repo
  - service
- name: TiaField
  tia_type: field
  layer: software_api
  description: 'One input or output field with its definition: where it goes (path, query, header, body), type, required, allowed values and limits.'
  properties:
  - name
  - in
  - field_type
  - required
  - multi
  - nullable
  - repo
  - service
  - allowed_values
  - max_length
  - min_length
  - minimum
  - maximum
  - exclusive_minimum
  - exclusive_maximum
  - pattern
  - format
- name: TiaExample
  tia_type: example
  layer: software_api
  description: 'An example or expected response: from the OpenAPI specification, or what a test asserts about the response (partial when the test
    checks only some fields). The body is JSON text.'
  properties:
  - name
  - status
  - body_json
  - partial
  - source
  - repo
  - service
  - file
  - line
  - test
- name: TiaRule
  tia_type: rule
  layer: software_rules
  description: 'A business rule found in code: a condition a function applies to the data it handles ("disputed payments are left out"). The link
    to a Knowledge Fabric rule is made by mapping (docs/NEO4J.md).'
  properties:
  - name
  - expr
  - fields
  - function
  - repo
  - service
  - file
  - line
- name: TiaTestCase
  tia_type: test_case
  layer: software_test
  description: A written (manual) test case kept in a repository (testcases/*.csv|yaml|json).
  properties:
  - case_id
  - title
  - entry_point
  - priority
  - steps
  - expected
  - repo
  - file
  - line
relationship_types:
- name: EXPOSES
  allowed_triples:
  - from: TiaService
    to: TiaEndpoint
  tia_impact: null
  description: A service exposes the endpoint.
- name: HANDLES
  allowed_triples:
  - from: TiaFunction
    to: TiaEndpoint
  tia_impact: src->dst
  description: The function handles requests to the endpoint.
- name: CALLS
  allowed_triples:
  - from: TiaFunction
    to: TiaFunction
  - from: TiaFunction
    to: TiaProcedure
  tia_impact: dst->src
  description: A function calls another function or a stored procedure.
- name: INHERITS
  allowed_triples:
  - from: TiaType
    to: TiaType
  tia_impact: dst->src
  description: A type extends or implements another.
- name: ISSUES
  allowed_triples:
  - from: TiaFunction
    to: TiaCallsite
  - from: TiaFunction
    to: TiaListener
  tia_impact: dst->src
  description: A function makes an outbound call or registers a listener.
- name: CONSUMES_API
  allowed_triples:
  - from: TiaCallsite
    to: TiaEndpoint
  - from: TiaContractRef
    to: TiaEndpoint
  - from: TiaRuntimeRef
    to: TiaEndpoint
  tia_impact: dst->src
  description: A consumer calls the endpoint (resolved call, declared contract or runtime observation).
- name: USES_SCHEMA
  allowed_triples:
  - from: TiaEndpoint
    to: TiaEventSchema
  - from: TiaEndpoint
    to: TiaSchema
  - from: TiaTopic
    to: TiaEventSchema
  - from: TiaTopic
    to: TiaSchema
  tia_impact: dst->src
  description: An endpoint or topic uses the schema for its messages.
- name: TESTS
  allowed_triples:
  - from: TiaTest
    to: TiaEndpoint
  - from: TiaTest
    to: TiaFunction
  tia_impact: dst->src
  description: An automated test exercises the endpoint or function.
- name: PUBLISHES
  allowed_triples:
  - from: TiaFunction
    to: TiaTopic
  - from: TiaService
    to: TiaTopic
  tia_impact: src->dst
  description: Code publishes to the topic.
- name: CONSUMES_EVENT
  allowed_triples:
  - from: TiaListener
    to: TiaTopic
  tia_impact: dst->src
  description: A listener consumes the topic.
- name: MAPS_TO
  allowed_triples:
  - from: TiaEntity
    to: TiaTable
  tia_impact: dst->src
  description: An entity maps the table.
- name: MAPS_COLUMN
  allowed_triples:
  - from: TiaEntity
    to: TiaColumn
  tia_impact: dst->src
  description: An entity maps the column.
- name: READS
  allowed_triples:
  - from: TiaFunction
    to: TiaColumn
  - from: TiaFunction
    to: TiaEntity
  - from: TiaFunction
    to: TiaTable
  - from: TiaProcedure
    to: TiaColumn
  - from: TiaProcedure
    to: TiaEntity
  - from: TiaProcedure
    to: TiaTable
  tia_impact: dst->src
  description: Code reads the data.
- name: WRITES
  allowed_triples:
  - from: TiaFunction
    to: TiaColumn
  - from: TiaFunction
    to: TiaEntity
  - from: TiaFunction
    to: TiaTable
  - from: TiaProcedure
    to: TiaColumn
  - from: TiaProcedure
    to: TiaEntity
  - from: TiaProcedure
    to: TiaTable
  tia_impact: dst->src
  description: Code writes the data.
- name: MIGRATES
  allowed_triples:
  - from: TiaMigration
    to: TiaTable
  tia_impact: null
  description: A migration changes the table.
- name: HAS_APPLICATION
  allowed_triples:
  - from: TiaService
    to: TiaApplication
  tia_impact: null
  description: The service's repository has this front end.
- name: HAS_SCREEN
  allowed_triples:
  - from: TiaApplication
    to: TiaScreen
  tia_impact: null
  description: The application has the screen.
- name: HAS_ELEMENT
  allowed_triples:
  - from: TiaScreen
    to: TiaElement
  tia_impact: null
  description: The screen shows the element.
- name: LOCATED_BY
  allowed_triples:
  - from: TiaElement
    to: TiaLocator
  tia_impact: null
  description: 'One way to find the element (best first: rank 1).'
- name: NAVIGATES_TO
  allowed_triples:
  - from: TiaScreen
    to: TiaScreen
  tia_impact: null
  description: The screen sends the user to another screen (a link, or a navigation call in its code).
- name: CALLS_API
  allowed_triples:
  - from: TiaScreen
    to: TiaEndpoint
  tia_impact: null
  description: The screen calls the endpoint (matched by method and path; inferred when more than one endpoint matches).
- name: ACCEPTS
  allowed_triples:
  - from: TiaEndpoint
    to: TiaRequest
  tia_impact: null
  description: The endpoint's request.
- name: RETURNS
  allowed_triples:
  - from: TiaEndpoint
    to: TiaResponse
  tia_impact: null
  description: The endpoint's response.
- name: HAS_FIELD
  allowed_triples:
  - from: TiaRequest
    to: TiaField
  - from: TiaResponse
    to: TiaField
  tia_impact: null
  description: A field of the request or response.
- name: HAS_EXAMPLE
  allowed_triples:
  - from: TiaResponse
    to: TiaExample
  tia_impact: null
  description: An example or expected response.
- name: APPLIES_RULE
  allowed_triples:
  - from: TiaFunction
    to: TiaRule
  tia_impact: null
  description: The function applies the business rule.
- name: COVERS
  allowed_triples:
  - from: TiaTestCase
    to: TiaEndpoint
  - from: TiaTestCase
    to: TiaScreen
  tia_impact: null
  description: A written test case tests the endpoint or screen it names (Neo4j mirror only).
- name: IMPACTS
  allowed_triples:
  - from: TiaNode
    to: TiaNode
  tia_impact: src->dst
  description: Every traversed relationship again, in the direction a change travels (Neo4j mirror only; `via` names it).
