version: 1.0.0
industry_id: health_insurance_care_services
policy_scope: Industry-level extraction guidance. Applicable domain and product line are supplied by the frozen customer
  ontology run context; only matching scoped few-shots are included.
example_provenance: Few-shot source text in this policy is illustrative synthetic text informed by the listed official
  domain references; it is not a quotation and does not establish legal or clinical applicability.
reference_sources:
- title: CMS Interoperability and Prior Authorization Final Rule CMS-0057-F
  url: https://www.cms.gov/newsroom/fact-sheets/cms-interoperability-and-prior-authorization-final-rule-cms-0057-f
  scope_note: Official CMS overview; applicability depends on payer type and governing rule.
- title: HHS HIPAA Security Rule
  url: https://www.hhs.gov/hipaa/for-professionals/security/index.html
  scope_note: Official HHS overview; policy examples do not determine covered-entity status or legal applicability.
block_categories:
- name: Requirement
  description: A source-supported obligation, capability, constraint, or desired system behavior.
  maps_to_node: Requirement
  examples:
  - 'PA-REQ-018: show authorization status and missing documentation.'
  anti_examples: []
- name: Process
  description: A named operational or business procedure supported by steps, actors, decisions, or system interactions.
  maps_to_node: Process
  examples:
  - Prior authorization intake; claim adjudication; care-plan follow-up.
  anti_examples: []
- name: Rule
  description: An explicit condition and resulting decision or action.
  maps_to_node: Rule
  examples:
  - If a service is not covered, route the request to a documented denial decision.
  anti_examples: []
- name: Control
  description: A concrete checkpoint or mechanism that verifies, restricts, authorizes, reconciles, or records an
    action.
  maps_to_node: Control
  examples:
  - Verify required documentation before releasing an authorization decision.
  anti_examples: []
- name: Regulation
  description: An explicitly identified external law, regulation, standard, or official instrument.
  maps_to_node: Regulation
  examples:
  - CMS-0057-F; HIPAA Security Rule (only when explicitly referenced).
  anti_examples: []
- name: TestCase
  description: An individual test procedure with a stated subject and verification intent.
  maps_to_node: TestCase
  examples:
  - TC-PA-018 verifies status and decision-reason visibility.
  anti_examples: []
- name: Defect
  description: A reported product or process malfunction with evidence of unintended behavior.
  maps_to_node: Defect
  examples:
  - DEF-CLM-031 reports a faulty rejection across a plan renewal date.
  anti_examples: []
- name: Incident
  description: A specific operational event such as an outage or service interruption.
  maps_to_node: Incident
  examples:
  - INC-CARE-006 reports a care-coordination queue interruption.
  anti_examples: []
- name: UserStory
  description: A user role’s stated goal or requested capability.
  maps_to_node: UserStory
  examples:
  - As a care coordinator, I need a consolidated view of open care-plan actions.
  anti_examples: []
- name: AcceptanceCriteria
  description: A testable condition that defines when a requirement or story is satisfied.
  maps_to_node: AcceptanceCriteria
  examples:
  - Given open care actions, when the coordinator opens the member record, then actions and owners appear.
  anti_examples: []
- name: TechnicalSystem
  description: A specifically named software application, platform, module, or service.
  maps_to_node: System
  examples:
  - A named EHR, claims platform, provider directory, or FHIR API described by the source.
  anti_examples: []
- name: TechnicalSpec
  description: A machine-readable or otherwise explicit interface contract, schema, or endpoint definition.
  maps_to_node: System
  examples:
  - An explicit FHIR API contract, schema, endpoint, or message specification.
  anti_examples: []
- name: TechnicalOps
  description: Operational technical detail such as scheduled jobs, configuration, deployment, or system events.
  maps_to_node: _SKIP_KG
  examples:
  - A scheduled claims batch or system event, retained as semantic evidence but not a graph node.
  anti_examples: []
- name: Reference
  description: A glossary item, definition, acronym, or reference information.
  maps_to_node: _SKIP_KG
  examples:
  - A glossary definition or code description, without a separate operational entity.
  anti_examples: []
- name: Diagram
  description: Visual content such as a workflow, architecture diagram, or form image.
  maps_to_node: _SKIP_KG
  examples:
  - A care workflow, payer/provider integration, or form image to interpret; not a graph node by itself.
  anti_examples: []
- name: FormCapture
  description: A specifically identified form or screen used to capture structured information.
  maps_to_node: FormCapture
  examples:
  - Health Claim Submission Form or Prior Authorization Request with identified purpose/fields.
  anti_examples: []
- name: Narrative
  description: General prose that does not meet a more specific supported category.
  maps_to_node: _SKIP_KG
  examples:
  - General health operations context not sufficiently structured for an eligible graph node.
  anti_examples: []
node_types:
- name: DomainRoot
  description: Customer-scoped domain anchor beneath CustomerRoot; industry is metadata and is never a graph root.
  name_pattern: Canonical domain ID only.
  examples:
  - health_insurance
  - care
  - pharmacy
- name: ProductLine
  description: Business line supplied by the selected customer/domain ontology; it is pre-seeded and never extracted
    from document text.
  name_pattern: Use the exact configured product-line name.
  examples:
  - Health Plan & Member Services
  - Claims
  - Provider & Network
  - Provider & Network
  - Care Management
  - Primary Care
  - Home & Post-Acute Care
  - Pharmacy & Pharmacy Benefits
- name: Function
  description: Business function in the selected customer/domain spine; pre-seeded and not extracted from text.
  name_pattern: Use the exact configured function label.
- name: SubFunction
  description: Specific capability in the selected customer/domain spine; pre-seeded and not extracted from text.
  name_pattern: Use the exact configured sub-function label.
- name: Requirement
  description: A testable obligation, capability, or constraint for payer, provider, pharmacy, member, or care operations.
    Preserve exact source evidence; do not convert clinical recommendations into product requirements.
  name_pattern: Short ID when present; full obligation in description.
  examples:
  - PA-REQ-018
  - Member Eligibility Evaluation
  reject_names:
  - requirement
  - healthcare
  - compliance
  anti_examples:
  - A diagnosis or treatment recommendation without a system or operational obligation is not a Requirement.
  - Do not infer an obligation from a section heading such as “Prior Authorization”.
  ie_examples:
  - scope:
      domain_id: health_insurance
      product_line_id: DOMAIN:health_insurance|PRODUCT_LINE:Health Plan & Member Services
      product_line_name: Health Plan & Member Services
    example_kind: illustrative_industry_source_text
    block_text: 'PA-REQ-018: The member portal shall show the authorization status and any documentation still required.'
    block_category: Requirement
    spine_node: Member Application
    entities:
    - type: Requirement
      value: PA-REQ-018
      confidence: 0.95
      description: The member portal shall show authorization status and outstanding documentation.
    - type: Process
      value: Prior Authorization Review
      confidence: 0.95
    relationships:
    - from_type: Requirement
      from_value: PA-REQ-018
      rel_type: IMPACTS
      to_type: Process
      to_value: Prior Authorization Review
      confidence: 0.9
- name: Process
  description: A named operational workflow in health coverage, claims, provider/network operations, care delivery,
