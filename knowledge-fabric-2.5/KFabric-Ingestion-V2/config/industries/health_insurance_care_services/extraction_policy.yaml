      domain_id: health_insurance
      product_line_id: DOMAIN:health_insurance|PRODUCT_LINE:Claims
      product_line_name: Claims
    example_kind: illustrative_industry_source_text
    block_text: When a claim arrives, the claims examiner checks member eligibility and coverage, reviews the submitted
      encounter details, and records the adjudication outcome in the claims platform.
    block_category: Process
    spine_node: Claim Submission
    entities:
    - type: Process
      value: Health Claim Adjudication
      confidence: 0.95
    - type: Actor
      value: Claims Examiner
      confidence: 0.95
    - type: System
      value: Claims Adjudication Platform
      confidence: 0.95
    relationships:
    - from_type: Process
      from_value: Health Claim Adjudication
