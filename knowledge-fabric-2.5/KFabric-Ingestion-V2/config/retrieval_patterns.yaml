# Retrieval Patterns — Intent-to-Category and Relationship Mapping
# Used by the retriever and test harness. NOT included in LLM prompts.
# v1.0

traversal_patterns:
  knowledge_discovery:
    description: "What do we know about X?"
    primary_categories: [Requirement, Process, Rule, Control, Regulation, TechnicalSpec, TechnicalOps]
    secondary_categories: [UserStory, TestCase, Defect, Incident, AcceptanceCriteria]
    relationship_types: [IMPLEMENTS, GOVERNED_BY, USES, PART_OF, IMPACTS]
    max_depth: 2

  change_impact:
    description: "Given a change, what is the blast radius?"
    primary_categories: [UserStory, Requirement, Process]
    secondary_categories: [TestCase, AcceptanceCriteria, System, Rule, Control]
    relationship_types: [IMPLEMENTS, IMPACTS, COVERS, GOVERNED_BY, USES, MITIGATES]
    max_depth: 3

  test_coverage:
    description: "Is requirement X fully covered?"
    primary_categories: [TestCase, AcceptanceCriteria, Requirement]
    secondary_categories: [UserStory, Defect]
    relationship_types: [COVERS, IMPLEMENTS, LINKED_TO]
    max_depth: 2

  regression_scope:
    description: "If system/process X changes, which test cases?"
    primary_categories: [TestCase, Process, System]
    secondary_categories: [Requirement, UserStory, AcceptanceCriteria]
    relationship_types: [USES, IMPACTS, COVERS, IMPLEMENTS]
    max_depth: 3

  defect_triage:
    description: "Triage defect X — what is its context?"
    primary_categories: [Defect, TestCase, Requirement, Incident]
    secondary_categories: [Process, System, UserStory, Rule]
    relationship_types: [LINKED_TO, IMPACTS, COVERS, IMPLEMENTS, GOVERNED_BY, USES]
    max_depth: 3

  root_cause:
    description: "Causal chain for incident X"
    primary_categories: [Incident, Defect, Process, System]
    secondary_categories: [TestCase, Rule, Control, Requirement]
    relationship_types: [LINKED_TO, IMPACTS, USES, GOVERNED_BY, MITIGATES]
    max_depth: 3

  compliance_control:
    description: "What controls/regulations govern X?"
    primary_categories: [Control, Regulation, Rule, Process]
    secondary_categories: [System, Defect, Incident]
    relationship_types: [MITIGATES, ENFORCED_BY, COMPLIANT_WITH, GOVERNED_BY]
    max_depth: 3

  cross_domain_impact:
    description: "Cross-domain blast radius of X"
    primary_categories: [Process, System, Regulation, Control]
    secondary_categories: [Requirement, Defect, Incident, Rule]
    relationship_types: [IMPACTS, COMPLIANT_WITH, USES, INTEGRATES_WITH, MITIGATES]
    max_depth: 3

  any:
    description: "General query — no pattern-specific filtering"
    primary_categories: []
    secondary_categories: []
    relationship_types: []
    max_depth: 2
