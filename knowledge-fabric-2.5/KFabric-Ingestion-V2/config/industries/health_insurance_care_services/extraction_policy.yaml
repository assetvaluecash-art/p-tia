      to_type: System
      to_value: Claims Adjudication Platform
      confidence: 0.9
    - from_type: Actor
      from_value: Claims Examiner
      rel_type: PERFORMS
      to_type: Process
      to_value: Health Claim Adjudication
      confidence: 0.9
- name: Rule
  description: An explicit internal coverage, operational, or routing condition with both condition and resulting
    decision. Keep source-specific plan and jurisdiction context.
  name_pattern: Require condition plus outcome; clinical guidance alone is not an internal business rule.
  examples:
  - Uncovered Service Routing
  - Authorization Documentation Routing
  reject_names:
  - rule
  - policy
  - guideline
  anti_examples:
  - A threshold or coverage statement without a conditional outcome is not a Rule.
  - Do not restate clinical guidance as an internal payer rule.
  ie_examples:
  - scope:
      domain_id: health_insurance
      product_line_id: DOMAIN:health_insurance|PRODUCT_LINE:Health Plan & Member Services
      product_line_name: Health Plan & Member Services
