    CustomerOnboardingResponse:
      type: object
      required:
      - tenant_id
      - customer_id
      - customer_name
      - industry_id
      - industry_name
      - status
      properties:
        tenant_id:
          type: string
          format: uuid
        customer_id:
          type: string
