  - Do NOT invent a description. It must be grounded in the source block.
- name: Defect
  layer: use_case
  description: Bug report or defect. Links to requirements (VIOLATES), test cases (MISSED_BY), incidents (LINKED_TO).
  name_pattern: DEF-{ID} or source ID (e.g., SYN-CL-3001). ≤80 chars.
  ie_examples:
  - block_text: 'SYN-CL-3015 | Interest Accrual not suspended after NAB classification | Detection: SIT | Root Cause: Business
      Logic Error | Module: Loan Servicing - Interest Accrual | Severity: High | Linked: USR-365'
    block_category: Defect
    entities:
    - type: Defect
      value: SYN-CL-3015
      description: Interest Accrual not suspended after NAB classification
      confidence: 0.95
    - type: Requirement
      value: USR-365
      confidence: 0.9
    - type: Process
      value: Interest Accrual
      confidence: 0.85
    relationships:
    - from_type: Defect
      from_value: SYN-CL-3015
      rel_type: VIOLATES
      to_type: Requirement
      to_value: USR-365
    - from_type: Defect
      from_value: SYN-CL-3015
      rel_type: IMPACTS
      to_type: Process
      to_value: Interest Accrual
  anti_examples:
  - Do NOT extract severity level or detection phase as entities — these go into extracted_fields
  - Do NOT discard the defect title when a defect ID is used as `value`; put the title/summary in `description`.
  - 'Do NOT replace the canonical defect ID with `ID : description`; `value` must remain the stable graph identifier.'
  - Do NOT include severity, detection phase, root cause, or status in `description` when those belong in extracted_fields.
  - Do NOT invent a description. It must be grounded in the source block.
- name: Incident
  layer: use_case
  description: Production incident record. Links to defects for root cause analysis.
  name_pattern: INC-{ID} from source. ≤80 chars.
  ie_examples:
  - block_text: 'INC-LOAN-089: Production incident — bullet repayment not applied to 12 new loans booked after config change.
      Impact: High. Related defect: DEF-2024-0567.'
    block_category: Incident
    entities:
    - type: Incident
      value: INC-LOAN-089
      description: Production incident — bullet repayment not applied to 12 new loans booked after config change.
      confidence: 0.95
    - type: Defect
      value: DEF-2024-0567
      confidence: 0.9
    - type: Process
      value: Loan Booking
      confidence: 0.85
    relationships:
    - from_type: Defect
      from_value: DEF-2024-0567
      rel_type: LINKED_TO
      to_type: Incident
      to_value: INC-LOAN-089
    - from_type: Incident
      from_value: INC-LOAN-089
      rel_type: IMPACTS
      to_type: Process
      to_value: Loan Booking
  - block_text: 'Incident INC-PAY-2024-041: RTGS payment gateway experienced intermittent timeouts between 14:00-16:30 UTC
      on 2024-06-12. Approximately 340 outbound payments were delayed. Severity P1. Operations team performed manual failover
      to backup gateway. Root cause under investigation. Impacts RTGS Payment Processing and downstream settlement.'
    block_category: Incident
    entities:
    - type: Incident
      value: INC-PAY-2024-041
      description: RTGS payment gateway experienced intermittent timeouts between 14:00-16:30 UTC on 2024-06-12. Approximately
        340 outbound payments were delayed.
      confidence: 0.95
    - type: System
      value: RTGS Payment Gateway
      confidence: 0.9
    - type: Process
      value: RTGS Payment Processing
      confidence: 0.85
    relationships:
    - from_type: Incident
      from_value: INC-PAY-2024-041
      rel_type: IMPACTS
      to_type: System
      to_value: RTGS Payment Gateway
    - from_type: Incident
      from_value: INC-PAY-2024-041
      rel_type: IMPACTS
      to_type: Process
      to_value: RTGS Payment Processing
  anti_examples:
  - Do NOT extract the impact level as an entity
  - Do NOT discard the incident summary when an incident ID is used as `value`; put the summary in `description`.
  - 'Do NOT replace the canonical incident ID with `ID : description`; `value` must remain the stable graph identifier.'
  - Do NOT include severity, timestamps, or status alone in `description` when those belong in extracted_fields.
  - Do NOT invent a description. It must be grounded in the source block.
- name: System
  layer: technical
  description: 'A named, deployable banking software platform, application, integration system, or named API service — something
    you can install, configure, or connect to. Valid examples: Temenos Transact, Murex, Finastra TI+, Kondour, Payment Hub,
    Online Banking Portal, Mobile Banking App, SWIFT Gateway, SMS Gateway, Statement Generation System, Core Banking System,
    LOS_Core, Actimize AML, Loan API. From TechnicalSpec API catalogs, extract the named API or service (Loan API from LOAN.API.3),
    not the operation. NOT HTTP methods, NOT operationIds, NOT REST paths, NOT accounting transaction codes, NOT customer
    types, NOT generic module references without a product name.'
  name_pattern: Title Case, proper product name ≤80 chars
  ie_examples:
  - block_text: The payment hub integrates with Temenos Transact for account validation, SWIFT Gateway for cross-border message
      transmission, and the SMS Gateway for customer notifications. Finastra TI+ handles treasury deal processing and feeds
      position data to Murex for risk calculation.
    block_category: TechnicalSystem
    entities:
    - type: System
      value: Payment Hub
      confidence: 0.97
    - type: System
      value: Temenos Transact
      confidence: 0.97
    - type: System
      value: SWIFT Gateway
      confidence: 0.95
    - type: System
      value: SMS Gateway
      confidence: 0.92
    - type: System
      value: Finastra TI+
      confidence: 0.95
    - type: System
      value: Murex
      confidence: 0.95
    relationships:
    - from_type: System
      from_value: Payment Hub
      rel_type: INTEGRATES_WITH
      to_type: System
      to_value: Temenos Transact
    - from_type: System
      from_value: Payment Hub
      rel_type: INTEGRATES_WITH
      to_type: System
      to_value: SWIFT Gateway
    - from_type: System
      from_value: Finastra TI+
      rel_type: INTEGRATES_WITH
      to_type: System
      to_value: Murex
  - block_text: I.NO Method Operation Id Operation Description. LOAN.API.3 PUT cancelArrangement Performs the loan cancellation
      for buy now pay later service. LOAN.API.4 POST createConsumerLoan Creates the creation of consumer loan for the given
      product.
    block_category: TechnicalSpec
    entities:
    - type: System
      value: Loan API
      confidence: 0.92
    relationships: []
  anti_examples:
  - Do NOT extract accounting entries as System — Dr Cash Arrangement, Cr Loan Account, Repayment To Me, Dr Customer Account
    are transaction/accounting codes not systems.
  - Do NOT extract customer types or customer states as System — Individual Customer, Corporate Customer, Unauthorised Customer,
    Deceased Customer are Actor or DataEntity types not systems.
  - Do NOT extract process or action names as System — Create Prospect, Activate Customer, Amend Customer, Authorise Customer,
    Delete External User are Processes not systems.
  - Do NOT extract abbreviations or transaction codes as System — Cm, Ft, Tt, Bom, Tab Arrangement Bom are codes not named
    systems.
  - Do NOT extract UI elements or menus as System — User Menu, Customer Relationship, Individual Customer Portal are UI elements
    not systems.
  - Do NOT extract generic words alone as System — System, Module, Engine, Service, Layer without a proper product name are
    not valid System entities.
  - Do NOT extract API operationIds, HTTP methods, or REST paths as System — cancelArrangement, createConsumerLoan, PUT, POST
    /loans are operations on a system, not the system. From a TechnicalSpec API catalog, extract the named API or service
    (Loan API from LOAN.API.3) as System.
- name: DataEntity
  layer: technical
  description: Named data object, report, or master record. Connected to processes via PRODUCES.
  name_pattern: Title Case, descriptive ≤80 chars
  ie_examples:
  - text: The Loan Disbursement Process produces the Loan Repayment Schedule containing principal, interest, due date, and
      outstanding balance.
    entities:
    - type: DataEntity
      value: Loan Repayment Schedule
      confidence: 0.95
    - type: Process
      value: Loan Disbursement Process
      confidence: 0.9
    relationships:
    - from_type: Process
      from_value: Loan Disbursement Process
      rel_type: PRODUCES
      to_type: DataEntity
      to_value: Loan Repayment Schedule
  - text: The Customer Master Record stores customer identity, contact, risk classification, and KYC status used during customer
      onboarding.
    entities:
    - type: DataEntity
      value: Customer Master Record
      confidence: 0.95
    - type: Process
      value: Customer Onboarding
      confidence: 0.9
    relationships: []
  anti_examples:
  - Do NOT extract field names like 'SSN' or 'Email' as DataEntity
  - Do NOT extract PII types as DataEntity
- name: Actor
  layer: context
  description: A role or persona that performs processes. Extracted from BPMN swimlanes, process docs. Enables role-based
    testing traversal.
  name_pattern: 'Title case role name: Relationship Manager, Credit Analyst, Back Office'
  anti_examples:
  - Do NOT extract system names as Actor — use System instead
  - Do NOT extract department names as Actor unless they represent a specific role
  ie_examples:
  - text: The Relationship Manager initiates the loan application and submits it to Credit Underwriting.
    entities:
    - type: Actor
      value: Relationship Manager
      confidence: 0.95
    - type: Process
      value: Loan Application
      confidence: 0.9
    relationships:
    - from_type: Actor
      from_value: Relationship Manager
      rel_type: PERFORMS
      to_type: Process
      to_value: Loan Application
  - text: The Credit Analyst reviews the applicant's financial information and performs credit assessment before the loan
      approval decision.
    entities:
    - type: Actor
      value: Credit Analyst
      confidence: 0.95
    - type: Process
      value: Credit Assessment
      confidence: 0.9
    relationships:
    - from_type: Actor
      from_value: Credit Analyst
      rel_type: PERFORMS
      to_type: Process
      to_value: Credit Assessment
relationship_types:
- name: PART_OF
  allowed_triples:
  - from: SubFunction
    to: Function
  - from: Function
    to: ProductLine
  - from: ProductLine
    to: DomainRoot
  - from: Process
    to: Function
  description: Hierarchical membership. Child is part of parent.
  verb: is part of
  example:
    from: Loan Origination
    to: SME Lending
    evidence: Loan Origination is a function within the SME Lending product line
    from_type: Function
    to_type: ProductLine
  anti_example: Do NOT use PART_OF for non-hierarchical connections — use IMPACTS instead
- name: IMPLEMENTS
  from: UserStory
  to: Requirement
  description: User story implements or realizes a requirement.
  verb: implements
  example:
    from: USR-365
    to: FR-04
    evidence: User story USR-365 implements the EMI schedule generation requirement FR-04
  anti_example: Do NOT use IMPLEMENTS for TestCase→Requirement (use COVERS)
- name: COVERS
  from: TestCase
  to: Requirement
  description: Test case covers or tests a requirement.
  verb: covers
  example:
    from: CLOS_DEL_SCN_004_TC_001
    to: DEL_CL_RTM_001
    evidence: Test case validates delinquency processing requirement
  anti_example: Do NOT use COVERS for UserStory→Requirement (use IMPLEMENTS)
- name: VALIDATES
  from: AcceptanceCriteria
  to: Requirement
  description: Acceptance criterion validates a requirement's completeness.
  verb: validates
  example:
    from: AC-FR04-01
    to: FR-04
    evidence: AC defines the expected bullet repayment schedule output for requirement FR-04
  anti_example: Do NOT use VALIDATES for TestCase→Requirement (use COVERS)
- name: IMPACTS
  allowed_triples:
  - from: UserStory
    to: Process
  - from: UserStory
    to: System
  - from: UserStory
    to: DataEntity
  - from: Requirement
    to: Process
  - from: Requirement
    to: System
  - from: Requirement
    to: DataEntity
  - from: Requirement
    to: Control
  - from: Defect
    to: Process
  - from: Defect
    to: System
  - from: Defect
    to: DataEntity
  - from: Incident
    to: Process
  - from: Incident
    to: System
  - from: Incident
    to: DataEntity
  - from: Process
    to: Process
  description: General impact relationship. Source impacts the target. Used for change analysis and blast radius.
  verb: impacts
  example:
    from: FR-04
    to: EMI Schedule Generation
    evidence: Requirement FR-04 impacts the EMI schedule generation process
    from_type: Requirement
    to_type: Process
  anti_example: Do NOT use IMPACTS for hierarchical relationships (use PART_OF)
- name: GOVERNED_BY
  allowed_triples:
  - from: Process
    to: Rule
  - from: Process
    to: Control
  description: Process is governed by a rule or controlled by an operational control.
  verb: is governed by
  example:
    from: Interest Accrual
    to: NAB Classification at 90 DPD
    evidence: Interest accrual ceases when NAB classification rule triggers at 90+ DPD
    from_type: Process
    to_type: Rule
  anti_example: Do NOT use GOVERNED_BY for process-to-process connections (use IMPACTS)
- name: USES
  from: Process
  to: System
  description: Process executes on or uses a system.
  verb: uses
  example:
    from: Delinquency Processing
    to: LOS_Core
    evidence: Delinquency processing runs on the LOS Core system
  anti_example: Do NOT use USES for process-to-process connections (use IMPACTS)
- name: VIOLATES
  allowed_triples:
  - from: Defect
    to: Requirement
  - from: Defect
    to: AcceptanceCriteria
  description: Defect violates or breaches a requirement or acceptance criterion.
  verb: violates
  example:
    from: SYN-CL-3015
    to: FR-04
    evidence: Defect SYN-CL-3015 violates the interest accrual suspension requirement
    from_type: Defect
    to_type: Requirement
  anti_example: Do NOT use VIOLATES for non-defect entities
- name: MISSED_BY
  from: Defect
  to: TestCase
  description: Defect was missed by (should have been caught by) a test case.
  verb: was missed by
  example:
    from: SYN-CL-3015
    to: CLOS_DEL_SCN_004_TC_001
    evidence: Delinquency test case should have caught the NAB classification defect
  anti_example: Do NOT use MISSED_BY for test cases that correctly found the defect
- name: LINKED_TO
  from: Defect
  to: Incident
  description: Bidirectional link between a defect and a production incident.
  verb: is linked to
  example:
    from: DEF-2024-0567
    to: INC-LOAN-089
    evidence: Defect DEF-2024-0567 caused production incident INC-LOAN-089
  anti_example: Do NOT use LINKED_TO for unrelated defect-incident pairs
- name: PRODUCES
  from: Process
  to: DataEntity
  description: Process produces or generates a data artifact.
  verb: produces
  example:
    from: Regulatory Reporting Batch
    to: Portfolio Outstanding Report
    evidence: The batch job generates the portfolio outstanding report
  anti_example: Do NOT use PRODUCES for process-to-process outputs (use IMPACTS)
- name: CROSS_DOMAIN_IMPACTS
  from: Process
  to: Process
  description: Process in one domain impacts a process in another domain. Cross-domain only.
  verb: cross-domain impacts
  example:
    from: SME Loan Product Setup
    to: Capital Adequacy Calculation
    evidence: Changes to SME loan products affect capital adequacy calculations in the risk domain
  anti_example: Do NOT use CROSS_DOMAIN_IMPACTS for same-domain process connections (use IMPACTS)
- name: PERFORMS
  from: Actor
  to: Process
  description: Actor/role performs or executes a process. Enables role-based testing queries.
  verb: performs
  example:
    from: Relationship Manager
    to: Loan Application
    evidence: The RM initiates and manages the loan application process
  anti_example: Do NOT use PERFORMS for Process-to-System — use USES instead. PERFORMS is Actor-to-Process only.
- name: MITIGATES
  allowed_triples:
  - from: Control
    to: Process
  - from: Control
    to: Rule
  description: Control mitigates risk in a process or enforces a rule. Control → Process means the control governs/gates the
    process.
  verb: mitigates
  example:
    from: Real-Time Sanctions Screening
    to: Outbound Payment Processing
    evidence: Sanctions screening control gates all outbound payments before release
    from_type: Control
    to_type: Process
  anti_example: Do NOT use MITIGATES for Process-to-Rule or Process-to-Control — use GOVERNED_BY instead. MITIGATES is Control-to-Process
    or Control-to-Rule.
- name: ENFORCED_BY
  allowed_triples:
  - from: Rule
    to: Regulation
  - from: Control
    to: Regulation
  description: Rule or control is enforced by an external regulation. Links internal governance to external mandates.
  verb: is enforced by
  example:
    from: CET1 Minimum 8% Plus Conservation Buffer
    to: Basel III
    evidence: The CET1 ratio rule is mandated by Basel III capital adequacy norms
    from_type: Rule
    to_type: Regulation
  anti_example: Do NOT use ENFORCED_BY between two internal rules — use GOVERNED_BY
- name: COMPLIANT_WITH
  from: Process
  to: Regulation
  description: Process must comply with an external regulation. Used for compliance tracing.
  verb: complies with
  example:
    from: Capital Adequacy Calculation
    to: Basel III
    evidence: Capital adequacy calculations must meet Basel III requirements
  anti_example: Do NOT use COMPLIANT_WITH for internal rules (use GOVERNED_BY)
- name: INTEGRATES_WITH
  from: System
  to: System
  description: System-to-system integration point. Captures interfaces, APIs, file feeds, and messaging between systems without
    creating a separate Interface node.
  verb: integrates with
  example:
    from: LOS_Core
    to: Core Banking System
    evidence: LOS sends approved loan records to Core Banking via real-time API for account creation
  anti_example: Do NOT use INTEGRATES_WITH for process-to-system — use USES instead
vision_ie_type_mapping:
  entity_types:
    Decision: Process
    Component: System
    Activity: Process
    Actor: Actor
    Control: Control
    Form: FormCapture
    Screen: FormCapture
    InputForm: FormCapture
  relationship_types:
    NEXT_STEP: _EXTRACTED_KNOWLEDGE
    GATEWAY_TO: _EXTRACTED_KNOWLEDGE
    CONDITION_IF_YES: _EXTRACTED_KNOWLEDGE
    CONDITION_IF_NO: _EXTRACTED_KNOWLEDGE
    PERFORMED_BY: PERFORMS
    ACTED_BY: PERFORMS
    CONTROL_PROTECTS_PROCESS: MITIGATES
path_format:
  style: natural_with_metadata
  include_evidence: true
  include_provenance: true
  template: "CHAIN_SYMBOLIC: {chain_symbolic}\nCHAIN_NATURAL: {chain_natural}\nRELATIONSHIP: {from_name} {rel_type_natural}\
    \ {to_name}\n  TYPE: {from_type} -> {to_type} ({rel_type})\n  EVIDENCE: \"{source_evidence}\"\n  SOURCE: {source_file}\
    \ [Page: {source_page}, Block: {source_block_id}]\n"
  rel_type_to_natural:
    PART_OF: is part of
    IMPLEMENTS: implements
    COVERS: covers
    VALIDATES: validates
    IMPACTS: impacts
    GOVERNED_BY: is governed by
    USES: uses
    VIOLATES: violates
    MISSED_BY: was missed by
    LINKED_TO: is linked to
    PRODUCES: produces
    CROSS_DOMAIN_IMPACTS: cross-domain impacts
    PERFORMS: performs
    MITIGATES: mitigates
    ENFORCED_BY: is enforced by
    COMPLIANT_WITH: complies with
    INTEGRATES_WITH: integrates with
    NODE_IN_DOMAIN: is in domain
