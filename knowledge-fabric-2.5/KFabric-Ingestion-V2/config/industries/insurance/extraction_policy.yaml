      value: Annuity Recommendation Review
      confidence: 0.95
    - type: Process
      value: Annuity Recommendation
      confidence: 0.95
    relationships:
    - from_type: Control
      from_value: Annuity Recommendation Review
      rel_type: MITIGATES
      to_type: Process
      to_value: Annuity Recommendation
      confidence: 0.9
  - scope:
      domain_id: health_insurance
