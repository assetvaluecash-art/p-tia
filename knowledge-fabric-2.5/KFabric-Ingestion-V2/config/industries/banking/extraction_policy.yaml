version: 5.0.1
node_types:
- name: DomainRoot
  description: Customer-scoped domain anchor beneath CustomerRoot. Industry is metadata and never a graph root.
  name_pattern: Exact domain key (snake_case)
  examples:
  - corporate_commercial
  - consumer_retail
- name: ProductLine
  description: Major business line within a domain. Hub node for graph traversal.
  name_pattern: Title Case, business name as known to the bank
  examples:
  - SME Lending
  - Trade Finance
  - Cash Management
- name: Function
  description: Business function within a product line. Groups related processes and requirements.
  name_pattern: Title Case, verb-noun phrase preferred
  examples:
  - Loan Origination
  - Loan Servicing
  - Letter of Credit
- name: SubFunction
  description: Specific capability within a function. Leaf of the pre-seeded spine.
  name_pattern: Title Case
  examples:
  - Credit Assessment
  - Collateral Valuation
  - Repayment Processing
- name: Requirement
  description: Functional or non-functional requirement statement. Core node for coverage and compliance tracing.
  name_pattern: ID when present in source (FR-xx, REQ-xxx). Else short descriptive phrase ≤80 chars.
  ie_examples:
  - block_text: 'FR-04: The system shall auto-generate a repayment schedule (EMI or bullet) upon loan booking, reflecting
      selected interest type, tenor, and repayment frequency.'
    block_category: Requirement
    spine_node: Repayment Processing
    entities:
    - type: Requirement
      value: FR-04
      description: The system shall auto-generate a repayment schedule (EMI or bullet) upon loan booking, reflecting
        selected interest type, tenor, and repayment frequency.
      confidence: 0.95
    - type: Process
      value: Loan Booking
      confidence: 0.9
    - type: Process
      value: EMI Schedule Generation
      confidence: 0.85
    relationships:
    - from_type: Requirement
      from_value: FR-04
      rel_type: IMPACTS
      to_type: Process
      to_value: Loan Booking
    - from_type: Requirement
      from_value: FR-04
      rel_type: IMPACTS
      to_type: Process
      to_value: EMI Schedule Generation
  - block_text: The system must validate that collateral value exceeds 120% of loan amount before approval can proceed.
    block_category: Requirement
    spine_node: Collateral Valuation
    entities:
    - type: Requirement
      value: Collateral Validation Threshold
      description: The system must validate that collateral value exceeds 120% of loan amount before approval can
        proceed.
      confidence: 0.95
    - type: Process
      value: Loan Approval
      confidence: 0.9
    relationships:
    - from_type: Requirement
      from_value: Collateral Validation Threshold
      rel_type: IMPACTS
      to_type: Process
      to_value: Loan Approval
  anti_examples:
  - Do NOT extract narrative prose or section introductions as Requirement
  - Do NOT extract section headings like '3. Functional Requirements' as Requirement
  - Do NOT discard the descriptive text when an entity has an ID. Preserve the ID as `value` and extract the human-readable
    statement into `description`.
  - 'Do NOT replace the canonical entity ID with `ID : description`; `value` must remain the stable identifier used
    for graph linking (e.g. FR-04).'
  - Do NOT invent a description. It must be grounded in the source block.
  - Do NOT duplicate the identifier inside description.
- name: Process
  description: Named, executable business process or workflow with concrete operational steps, system interactions,
    or defined inputs/outputs. Must be a specific process that an organization performs — not an abstract concept,
    methodology phase, lifecycle stage name, or sales description of an approach.
  name_pattern: Title Case, descriptive verb-noun phrase ≤80 chars
  evidence_gate:
    enabled: true
    min_evidence_score: 3
    step_keywords:
    - step
    - then
    - after
    - before
    - first
    - next
    - followed by
    - sequence
    - procedure
    - workflow
    - navigate
    - click
    - enter
    - select
    actor_keywords:
    - manager
    - officer
    - agent
    - user
    - team
    - analyst
    - clerk
    - applicant
    - customer
    - borrower
    - maker
    - checker
    - approver
    - administrator
    system_keywords:
    - system
    - module
    - screen
    - portal
    - application
    - database
    - API
    - interface
    - core banking
    - T24
    - LOS
    - CRM
    - ERP
    - SWIFT
    action_keywords:
    - execute
    - process
    - submit
    - validate
    - create
    - generate
    - verify
    - approve
    - reject
    - initiate
    - configure
    - disburse
    - accrue
    - settle
    - book
    - capture
    - assess
    - classify
    - compute
    - reconcile
    outcome_keywords:
    - produces
    - results in
    - generates
    - completes
    - approved
    - booked
    - disbursed
    - settled
    - report produced
    - outcome
    - output
    exclusion_keywords:
    - batch
    - scheduled job
    - nightly run
    - daily run
    - eod processing
    - eom processing
    - accrual run
    - posting run
    - background job
    - automated sweep
    - scheduled task
    - navigate to
    - click on
    - enter the field
    - pre-requisites
    - pre-condition
    - test step
    - login and approve
  ie_examples:
  - block_text: 'Loan disbursement initiation: The maker enters the disbursement instruction in LOS_Core specifying
      account number, amount, and value date. The system validates available limit against sanctioned amount. On success
      the maker submits for checker review. The checker approves in LOS_Core. On dual approval the disbursement request
      is transmitted to Core Banking for fund transfer execution.'
    block_category: Process
    spine_node: Loan Disbursement
    entities:
    - type: Process
      value: Loan Disbursement Initiation
      confidence: 0.95
    - type: System
      value: LOS_Core
      confidence: 0.9
    - type: System
      value: Core Banking
      confidence: 0.88
    - type: Actor
      value: Maker
      confidence: 0.85
    - type: Actor
      value: Checker
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Loan Disbursement Initiation
      rel_type: USES
      to_type: System
      to_value: LOS_Core
    - from_type: Actor
      from_value: Maker
      rel_type: PERFORMS
      to_type: Process
      to_value: Loan Disbursement Initiation
  anti_examples:
  - Do NOT extract flowchart box labels like 'Check band' as Process — these are diagram elements
  - Do NOT extract state names like 'Rejected' or 'Approved' as Process — these are states
  - Do NOT extract data values like 'AggressiveProfile' as Process
  - Do NOT extract abstract methodology stages like 'Requirement Stage', 'Design Stage', 'Test Planning', 'Test Execution',
    'Test Design' as Process — these are methodology phases, not executable workflows
  - Do NOT extract sales or marketing descriptions of approaches, capabilities, or value propositions as Process
  - Do NOT extract lifecycle phase names (e.g., 'Planning Phase', 'Execution Phase') unless they describe concrete
    operational steps with actors and systems
  - Do NOT extract single-word abstract capabilities like 'Automation', 'Integration', 'Validation', 'Customization',
    'Scale', or 'Governance' as Process — these are generic concepts
  - Do NOT extract product or tool feature names like 'Pulse Intelligence', 'Pulse Automation', 'Gateway Integration'
    as Process — these are software components, not business processes
  - Do NOT extract benefit descriptions or outcome phrases like 'Clarity & Testability', 'Faster Certification', 'Governed
    Coverage Creation', 'Risk-Based Validation' as Process
  - Do NOT extract SDLC activity labels like 'Risk Identification', 'System Impact Discovery', 'Historical Defect
    Intelligence' as Process unless the text describes a specific workflow with concrete steps, actors, and systems
  - 'Do NOT extract scheduled batch jobs, cron tasks, or automated events as Process — classify as TechnicalOps instead.
    Examples: ''Daily DPD Calculation Batch'', ''Monthly EMI Due Generation'', ''Benchmark Rate Refresh Job'', ''Interest
    Accrual Suspension Job'', ''End-of-Day Reconciliation'''
  - 'Do NOT extract system lifecycle events or state transitions as Process — classify as TechnicalOps. Examples:
    ''Approval Event'', ''Status Change'', ''File Upload Trigger'', ''Notification Dispatch'''
  - Do NOT extract SubFunction spine node names as Process entities — EMI Calculation, Eligibility Check, Disbursement,
    NAB Classification, Repayment Processing are pre-seeded SubFunction nodes. Set spine_node to the matching SubFunction
    instead.
  - Do NOT extract API method names or REST endpoint strings as Process — createConsumerLoan, cancelArrangement, LOAN.API.3
    PUT, POST /loans are API operations. Classify the block as TechnicalSpec.
- name: Rule
  description: Business rule with explicit conditional logic — if X then Y, unless X apply Y, when X triggers Y. BOTH
    condition AND consequence must be stated. Threshold constraints without a stated consequence are Requirements
    not Rules. For operational enforcement mechanisms use Control instead.
  name_pattern: Title Case or RULE-ID if present, descriptive ≤80 chars
  ie_examples:
  - block_text: 'Interest accrual ceases when account reaches 90+ DPD and is classified as Non-Accrual of Business
      (NAB). Repayment priority follows: Interest → Charges → Tax → Principal.'
    block_category: Rule
    spine_node: Interest Accrual
    entities:
    - type: Rule
      value: NAB Classification at 90 DPD
      confidence: 0.95
    - type: Rule
      value: Repayment Priority Order
      confidence: 0.9
    - type: Process
      value: Interest Accrual
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Interest Accrual
      rel_type: GOVERNED_BY
      to_type: Rule
      to_value: NAB Classification at 90 DPD
  - block_text: If a pricing override is submitted, the user must provide documented justification, and the system
      must log user ID, timestamp, old rate, new rate, and reason for the override.
    block_category: Rule
    entities:
    - type: Rule
      value: Pricing Override Justification
      confidence: 0.95
    - type: Process
      value: Pricing Override
      confidence: 0.9
    relationships:
    - from_type: Process
      from_value: Pricing Override
      rel_type: GOVERNED_BY
      to_type: Rule
      to_value: Pricing Override Justification
  anti_examples:
  - Do NOT extract narrative descriptions of policy background as Rule
  - Do NOT extract external regulations (Basel III, OFAC) as Rule — use Regulation
  - Do NOT extract operational controls (sanctions screening gate) as Rule — use Control
  - Do NOT extract threshold constraints as Rule when no consequence is stated — collateral must exceed 120% is a
    Requirement not a Rule
  - Do NOT extract process sequencing language as Rule — maker submits for checker approval is a Process step not
    a Rule
- name: Control
  description: Operational enforcement mechanism that mitigates risk or enforces rules. SOX controls, compliance gates,
    screening checks, audit checkpoints. Distinct from Rule (which states the logic) — Control is the mechanism that
    enforces it.
  name_pattern: Title Case, descriptive ≤80 chars
  ie_examples:
  - block_text: Real-time sanctions screening must execute on all outbound payments above $5,000. The screening control
      checks against OFAC SDN, UN, and EU sanctions lists. Flagged transactions are held pending compliance review.
    block_category: Control
    entities:
    - type: Control
      value: Real-Time Sanctions Screening
      confidence: 0.95
    - type: Process
      value: Outbound Payment Processing
      confidence: 0.9
    - type: Regulation
      value: OFAC SDN List
      confidence: 0.85
    relationships:
    - from_type: Control
      from_value: Real-Time Sanctions Screening
      rel_type: MITIGATES
      to_type: Process
      to_value: Outbound Payment Processing
    - from_type: Control
      from_value: Real-Time Sanctions Screening
      rel_type: ENFORCED_BY
      to_type: Regulation
      to_value: OFAC SDN List
  - block_text: 'KYC completion gate: No account can be activated until KYC verification status = COMPLETE and risk
      rating is assigned. This is a mandatory SOX control for new customer onboarding.'
    block_category: Control
    entities:
    - type: Control
      value: KYC Completion Gate
      confidence: 0.95
    - type: Process
      value: New Customer Onboarding
      confidence: 0.9
    relationships:
    - from_type: Control
      from_value: KYC Completion Gate
      rel_type: MITIGATES
      to_type: Process
      to_value: New Customer Onboarding
  anti_examples:
  - Do NOT extract business logic like 'if amount > $1M then escalate' as Control — that is a Rule
  - Do NOT extract external regulations as Control — use Regulation
- name: Regulation
  description: External regulatory mandate, industry standard, or compliance guideline. Basel III, OFAC, GDPR, PCI-DSS,
    RBI Master Circular, SOX. These are external to the bank and enforce Controls.
  name_pattern: 'Official name or abbreviation as commonly known: Basel III, OFAC, GDPR'
  ie_examples:
  - block_text: All capital adequacy calculations must comply with Basel III norms. The bank maintains a minimum CET1
      ratio of 8% with a 2.5% conservation buffer as mandated by the central bank.
    block_category: Regulation
    entities:
    - type: Regulation
      value: Basel III
      confidence: 0.95
    - type: Process
      value: Capital Adequacy Calculation
      confidence: 0.9
    - type: Rule
      value: CET1 Minimum 8% Plus Conservation Buffer
      confidence: 0.85
    relationships:
    - from_type: Process
      from_value: Capital Adequacy Calculation
      rel_type: COMPLIANT_WITH
      to_type: Regulation
      to_value: Basel III
    - from_type: Rule
      from_value: CET1 Minimum 8% Plus Conservation Buffer
      rel_type: ENFORCED_BY
      to_type: Regulation
      to_value: Basel III
  - block_text: PCI-DSS compliance requires encryption of cardholder data at rest and in transit. Annual penetration
      testing and quarterly vulnerability scans are mandatory.
    block_category: Regulation
    entities:
    - type: Regulation
      value: PCI-DSS
      confidence: 0.95
    - type: Control
      value: Cardholder Data Encryption
      confidence: 0.9
    relationships:
    - from_type: Control
      from_value: Cardholder Data Encryption
      rel_type: ENFORCED_BY
      to_type: Regulation
      to_value: PCI-DSS
  anti_examples:
  - Do NOT extract internal policies as Regulation — those are Rules
  - Do NOT extract control mechanisms as Regulation — those are Controls
- name: FormCapture
  description: A data capture form, input screen, or UI mockup. Stores extracted fields as properties and links to
    governing controls/rules.
  name_pattern: Form title or screen name
  ie_examples:
  - block_text: 'KYC Verification Form for SME Loan Applicants. Fields: Applicant Name, Date of Incorporation, ID
      Type, ID Number, Registered Address, Risk Rating, KYC Status, Verified By. Must be completed before account
      activation per CTRL-KYC-001.'
    block_category: FormCapture
    entities:
    - type: FormCapture
      value: KYC Verification Form
      confidence: 0.95
    - type: Control
      value: CTRL-KYC-001
      description: Must be completed before account activation
      confidence: 0.9
    relationships: null
  anti_examples:
  - System architecture diagram
  - Process flow chart
- name: UserStory
  description: User story or feature request. Links to requirements via IMPLEMENTS.
  name_pattern: JIRA/tool ID when present (JIRA-xxx, USR-xxx). Else short title ≤80 chars.
  ie_examples:
  - block_text: 'As a relationship manager, I want to configure bullet repayment schedules for SME loans, so that
      product setup reflects the agreed terms. Sprint: Q1-2025, Priority: High'
    block_category: UserStory
    entities:
    - type: UserStory
      value: Bullet Repayment Configuration
      description: As a relationship manager, I want to configure bullet repayment schedules for SME loans, so that
        product setup reflects the agreed terms.
      confidence: 0.95
    - type: Requirement
      value: Bullet Repayment Schedule
      confidence: 0.9
    - type: Process
      value: SME Loan Product Setup
      confidence: 0.85
    relationships:
    - from_type: UserStory
      from_value: Bullet Repayment Configuration
      rel_type: IMPLEMENTS
      to_type: Requirement
      to_value: Bullet Repayment Schedule
    - from_type: UserStory
      from_value: Bullet Repayment Configuration
      rel_type: IMPACTS
      to_type: Process
      to_value: SME Loan Product Setup
  anti_examples:
  - Do NOT extract sprint name or priority as entities — these go into extracted_fields
  - Do NOT extract the actor role from 'As a [role]' as a separate entity
  - Do NOT discard the story text when an ID or short title is used as `value`; put the story/title summary in `description`.
  - 'Do NOT replace the canonical entity ID/title with `ID : description`; `value` must remain the stable graph identifier.'
  - Do NOT include sprint, priority, or status metadata in `description` when those belong in extracted_fields.
  - Do NOT invent a description. It must be grounded in the source block.
- name: AcceptanceCriteria
  description: Acceptance criterion tied to a requirement. Validates requirement completeness.
  name_pattern: AC-{parent_req}-{seq} when parent known. Else descriptive ≤80 chars.
  ie_examples:
  - block_text: 'AC-FR04-01: Given a new loan is booked with bullet repayment, When the schedule is generated, Then
      the system shall create a single principal payment at maturity with periodic interest-only payments.'
    block_category: AcceptanceCriteria
    entities:
    - type: AcceptanceCriteria
      value: AC-FR04-01
      description: Given a new loan is booked with bullet repayment, When the schedule is generated, Then the system
        shall create a single principal payment at maturity with periodic interest-only payments.
      confidence: 0.95
    - type: Requirement
      value: FR-04
      confidence: 0.9
    relationships:
    - from_type: AcceptanceCriteria
      from_value: AC-FR04-01
      rel_type: VALIDATES
      to_type: Requirement
      to_value: FR-04
  anti_examples:
  - Do NOT extract Given/When/Then keywords as entities
  - Do NOT discard the Given/When/Then statement when an AC ID is used as `value`; put the criterion text in `description`.
  - 'Do NOT replace the canonical AC ID with `ID : description`; keep `value` as AC-FR04-01 for graph linking.'
  - Do NOT invent a Requirement description when only the ID (e.g. FR-04) is referenced — leave description empty
    on that reference.
  - Do NOT duplicate the identifier inside description.
- name: TestCase
  description: Individual test procedure including manual test scripts, UI navigation test steps, and automated test
    definitions. Blocks with preconditions, numbered steps (Navigate To, Click, Enter, Select, Verify), and expected
    results. Xray, Zephyr, and Excel-based test sheets. ANY block describing how to manually or automatically execute
    a test belongs here — NOT in Process. Individual UI steps (Navigate To, Click, Enter) are test steps within the
    TestCase node, not separate Process entities. Test case with steps, preconditions, expected results. Links to
    requirements via COVERS.
  name_pattern: TC-{source_short}-{row#} for spreadsheets. Source ID if available (e.g., CLOS_DEL_SCN_004_TC_001).
    ≤80 chars.
  ie_examples:
  - block_text: 'Test Case CLOS_DEL_SCN_004_TC_001 | Scenario: Delinquency processing for Long Term Loan | Priority:
      High | Requirement: DEL_CL_RTM_001 | Step 1: Login to LOS_Core | Step 2: Navigate to Delinquency screen | Step
      3: Enter mandatory fields | Expected: Delinquency classification applied'
    block_category: TestCase
    entities:
    - type: TestCase
      value: CLOS_DEL_SCN_004_TC_001
      description: Delinquency processing for Long Term Loan
      confidence: 0.95
    - type: Requirement
      value: DEL_CL_RTM_001
      confidence: 0.9
    - type: Process
      value: Delinquency Processing
      confidence: 0.85
    - type: System
      value: LOS_Core
      confidence: 0.85
    relationships:
    - from_type: TestCase
      from_value: CLOS_DEL_SCN_004_TC_001
      rel_type: COVERS
      to_type: Requirement
      to_value: DEL_CL_RTM_001
  anti_examples:
  - Do NOT extract individual test steps as separate entities
  - Do NOT extract test data values as entities
  - Do NOT discard the scenario/title when a test case ID is used as `value`; put the scenario/title in `description`.
  - 'Do NOT replace the canonical test case ID with `ID : description`; `value` must remain the stable graph identifier.'
  - Do NOT include priority, status, or step lists in `description` when those belong in extracted_fields.
  - Do NOT invent a description. It must be grounded in the source block.
- name: Defect
  description: Bug report or defect. Links to requirements (VIOLATES), test cases (MISSED_BY), incidents (LINKED_TO).
  name_pattern: DEF-{ID} or source ID (e.g., SYN-CL-3001). ≤80 chars.
  ie_examples:
  - block_text: 'SYN-CL-3015 | Interest Accrual not suspended after NAB classification | Detection: SIT | Root Cause:
      Business Logic Error | Module: Loan Servicing - Interest Accrual | Severity: High | Linked: USR-365'
    block_category: Defect
    entities:
    - type: Defect
      value: SYN-CL-3015
      description: Interest Accrual not suspended after NAB classification
      confidence: 0.95
    - type: Requirement
      value: USR-365
      confidence: 0.9
    - type: Process
      value: Interest Accrual
      confidence: 0.85
    relationships:
    - from_type: Defect
      from_value: SYN-CL-3015
      rel_type: VIOLATES
      to_type: Requirement
      to_value: USR-365
    - from_type: Defect
      from_value: SYN-CL-3015
      rel_type: IMPACTS
      to_type: Process
      to_value: Interest Accrual
  anti_examples:
  - Do NOT extract severity level or detection phase as entities — these go into extracted_fields
  - Do NOT discard the defect title when a defect ID is used as `value`; put the title/summary in `description`.
  - 'Do NOT replace the canonical defect ID with `ID : description`; `value` must remain the stable graph identifier.'
  - Do NOT include severity, detection phase, root cause, or status in `description` when those belong in extracted_fields.
  - Do NOT invent a description. It must be grounded in the source block.
- name: Incident
  description: Production incident record. Links to defects for root cause analysis.
  name_pattern: INC-{ID} from source. ≤80 chars.
  ie_examples:
