version: 1.0.0
industry_id: insurance
policy_scope: Industry-level extraction guidance. Applicable domain and product line are supplied by the frozen customer
  ontology run context; only matching scoped few-shots are included.
example_provenance: Few-shot source text in this policy is illustrative synthetic text informed by the listed official
  domain references; it is not a quotation and does not establish legal or clinical applicability.
reference_sources:
- title: NAIC Model Laws
  url: https://content.naic.org/model-laws
  scope_note: Model laws/regulations require jurisdiction-specific adoption; do not treat model text as universally
    enacted law.
- title: NAIC Annuities topic
  url: https://content.naic.org/insurance-topics/annuities
  scope_note: Official NAIC context for annuity suitability model regulation.
- title: IRS Required Minimum Distributions
  url: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions
  scope_note: Official IRS overview; eligibility and timing depend on applicable law and plan terms.
block_categories:
- name: Requirement
  description: A source-supported obligation, capability, constraint, or desired system behavior.
  maps_to_node: Requirement
  examples:
  - 'CLM-REQ-041: show claim status and outstanding information.'
  anti_examples: []
- name: Process
  description: A named operational or business procedure supported by steps, actors, decisions, or system interactions.
  maps_to_node: Process
  examples:
  - First notice of loss intake; underwriting review; premium payment posting.
  anti_examples: []
- name: Rule
  description: An explicit condition and resulting decision or action.
  maps_to_node: Rule
  examples:
  - If the loss date is outside the policy period, route to a documented coverage decision.
  anti_examples: []
- name: Control
  description: A concrete checkpoint or mechanism that verifies, restricts, authorizes, reconciles, or records an
    action.
  maps_to_node: Control
  examples:
  - Check customer profile and recommendation rationale before submitting an annuity recommendation.
  anti_examples: []
- name: Regulation
  description: An explicitly identified external law, regulation, standard, or official instrument.
  maps_to_node: Regulation
  examples:
  - NAIC Model 275; IRS retirement distribution guidance, only as explicitly cited.
  anti_examples: []
- name: TestCase
  description: An individual test procedure with a stated subject and verification intent.
  maps_to_node: TestCase
  examples:
  - TC-POL-115 verifies beneficiary-change fields and updated policy record.
  anti_examples: []
- name: Defect
  description: A reported product or process malfunction with evidence of unintended behavior.
  maps_to_node: Defect
  examples:
  - DEF-HO-028 reports a claim closing despite requested evidence.
  anti_examples: []
- name: Incident
  description: A specific operational event such as an outage or service interruption.
  maps_to_node: Incident
  examples:
  - INC-BILL-012 reports a premium posting interruption.
  anti_examples: []
- name: UserStory
  description: A user role’s stated goal or requested capability.
  maps_to_node: UserStory
  examples:
  - As a plan operations analyst, I need a queue for participants approaching a distribution date.
  anti_examples: []
- name: AcceptanceCriteria
  description: A testable condition that defines when a requirement or story is satisfied.
  maps_to_node: AcceptanceCriteria
  examples:
  - Given a participant approaching a plan date, when the queue opens, then due date and source balance date are shown.
  anti_examples: []
- name: TechnicalSystem
  description: A specifically named software application, platform, module, or service.
  maps_to_node: System
  examples:
  - A named policy, claims, billing, or annuity administration platform from the source.
  anti_examples: []
- name: TechnicalSpec
  description: A machine-readable or otherwise explicit interface contract, schema, or endpoint definition.
  maps_to_node: System
  examples:
  - An explicit API contract, policy-message schema, endpoint, or interface specification.
  anti_examples: []
- name: TechnicalOps
  description: Operational technical detail such as scheduled jobs, configuration, deployment, or system events.
  maps_to_node: _SKIP_KG
  examples:
  - A scheduled premium batch or automated policy event, stored as semantic evidence only.
  anti_examples: []
- name: Reference
  description: A glossary item, definition, acronym, or reference information.
  maps_to_node: _SKIP_KG
  examples:
  - A glossary definition or product-term description without a separate graph entity.
  anti_examples: []
- name: Diagram
  description: Visual content such as a workflow, architecture diagram, or form image.
  maps_to_node: _SKIP_KG
  examples:
  - A claims, underwriting, policy-servicing, or retirement workflow image to interpret.
  anti_examples: []
- name: FormCapture
  description: A specifically identified form or screen used to capture structured information.
  maps_to_node: FormCapture
  examples:
  - Beneficiary Change Request or First Notice of Loss Form with identified purpose/fields.
  anti_examples: []
- name: Narrative
  description: General prose that does not meet a more specific supported category.
  maps_to_node: _SKIP_KG
  examples:
  - General insurance context not sufficiently structured for an eligible graph node.
  anti_examples: []
node_types:
- name: DomainRoot
  description: Customer-scoped domain anchor beneath CustomerRoot; industry is metadata and is never a graph root.
  name_pattern: Canonical domain ID only.
  examples:
  - property_casualty
  - life_insurance
  - annuities
  - health_insurance
  - retirement_workplace_benefits
  - employee_benefits
  - insurance_operations_services
- name: ProductLine
  description: Business line supplied by the selected customer/domain ontology; it is pre-seeded and never extracted
    from document text.
  name_pattern: Use the exact configured product-line name.
  examples:
  - Personal Auto
  - Commercial Auto
  - Homeowners
  - Renters
  - Personal Umbrella
  - Commercial Property
  - Commercial General Liability
  - Workers' Compensation
  - Specialty Insurance
  - Term Life
  - Whole Life
  - Universal Life
  - Variable Universal Life
  - Final Expense
  - Fixed Annuities
  - Fixed Indexed Annuities
  - Variable Annuities
  - Immediate Annuities
  - Individual & Family Health
  - Group Health
  - Medicare
  - Medicaid
  - Dental
  - Vision
  - 401(k)
  - 403(b)
  - '457'
  - Pension
  - Profit Sharing
  - IRA & Individual Retirement
  - Group Life
  - Group Disability
  - Group Dental
  - Group Vision
  - Voluntary Benefits
  - Leave & Absence Benefits
  - Distribution & Agency
  - Billing & Payments
  - Policy Administration
  - Claims Administration
  - Underwriting
  - Customer & Member Services
  - Provider & Network Management
  - Regulatory & Compliance
- name: Function
  description: Business function in the selected customer/domain spine; pre-seeded and not extracted from text.
  name_pattern: Use the exact configured function label.
- name: SubFunction
  description: Specific capability in the selected customer/domain spine; pre-seeded and not extracted from text.
  name_pattern: Use the exact configured sub-function label.
- name: Requirement
  description: A testable obligation, capability, or constraint for underwriting, policy administration, billing,
    claims, distribution, annuity, retirement, or benefits operations. Preserve exact source evidence.
  name_pattern: Short ID when present; full obligation in description.
  examples:
  - CLM-REQ-041
  - Beneficiary Change Validation
  reject_names:
  - requirement
  - insurance
  - compliance
  anti_examples:
  - A contract clause mentioned without a system/operational requirement is not automatically a Requirement.
  - Do not infer product behavior from a policy title.
  ie_examples:
  - scope:
      domain_id: property_casualty
      product_line_id: DOMAIN:property_casualty|PRODUCT_LINE:Personal Auto
      product_line_name: Personal Auto
    example_kind: illustrative_industry_source_text
    block_text: 'CLM-REQ-041: The claims portal shall show the claimant the current claim status and outstanding information
      needed to continue review.'
    block_category: Requirement
    spine_node: Quote Creation
    entities:
    - type: Requirement
      value: CLM-REQ-041
      confidence: 0.95
      description: The claims portal shows status and outstanding information needed for review.
    - type: Process
      value: Auto Claim Review
      confidence: 0.95
    relationships:
    - from_type: Requirement
      from_value: CLM-REQ-041
      rel_type: IMPACTS
      to_type: Process
      to_value: Auto Claim Review
      confidence: 0.9
- name: Process
  description: A named operational workflow in policy lifecycle, underwriting, claims, billing, distribution, annuity
    servicing, retirement plans, or benefits operations. Require concrete work steps, actors, decisions, or system
    interactions.
  name_pattern: Name the workflow, not a product line or general insurance concept.
  examples:
  - First Notice of Loss Intake
  - Risk Underwriting Review
  - Premium Payment Posting
  reject_names:
  - process
  - workflow
  - storage
  - validation
  - management
  anti_examples:
  - A product or coverage name alone is not an operational Process.
  - A generic noun such as “Storage” or “Processing” is not a named workflow.
  ie_examples:
  - scope:
      domain_id: insurance_operations_services
      product_line_id: DOMAIN:insurance_operations_services|PRODUCT_LINE:Claims Administration
      product_line_name: Claims Administration
    example_kind: illustrative_industry_source_text
    block_text: On first notice of loss, the claim handler records the loss details, checks the policy in force for
      the loss date, assigns an adjuster, and routes the file for coverage review.
    block_category: Process
    spine_node: First Notice of Loss
    entities:
    - type: Process
      value: First Notice of Loss Intake
      confidence: 0.95
    - type: Actor
      value: Claims Handler
      confidence: 0.95
    - type: System
      value: Claims Management Platform
      confidence: 0.95
    relationships:
    - from_type: Process
      from_value: First Notice of Loss Intake
      rel_type: USES
      to_type: System
      to_value: Claims Management Platform
      confidence: 0.9
    - from_type: Actor
      from_value: Claims Handler
      rel_type: PERFORMS
      to_type: Process
      to_value: First Notice of Loss Intake
      confidence: 0.9
- name: Rule
  description: An explicit internal coverage, eligibility, pricing, servicing, or routing condition with both condition
    and resulting action. Preserve policy and jurisdiction context.
  name_pattern: Require condition plus consequence; an external law is Regulation.
  examples:
  - Loss Outside Policy Period
  - Annuity Eligibility Routing
  reject_names:
  - rule
  - policy
  - guideline
  anti_examples:
  - A limit without a stated consequence is not a Rule.
  - Do not turn a model law or contract title into an internal Rule.
  ie_examples:
  - scope:
      domain_id: property_casualty
      product_line_id: DOMAIN:property_casualty|PRODUCT_LINE:Commercial Auto
      product_line_name: Commercial Auto
    example_kind: illustrative_industry_source_text
    block_text: If the reported loss date falls outside the policy period, mark the claim as not covered and send
      the file for a documented coverage decision.
    block_category: Rule
    spine_node: Fleet Risk Assessment
    entities:
    - type: Rule
      value: Loss Outside Policy Period
      confidence: 0.95
      description: If the loss date is outside the policy period, route the file for a documented coverage decision.
    relationships: []
- name: Control
  description: An operational checkpoint that verifies, authorizes, reconciles, documents, or restricts underwriting,
    claims, policy, payment, recommendation, or plan actions.
  name_pattern: Name a control mechanism; do not extract an abstract control objective.
  examples:
  - Annuity Recommendation Review
  - Claim Payment Reconciliation
  reject_names:
  - control
  - check
  - validation
  anti_examples:
  - An abstract objective such as “fair claims handling” is not a Control without a concrete checkpoint.
  ie_examples:
