[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tia"
version = "1.0.0"
description = "TIA - Technical Impact Analysis (Phase 1: cross-repository REST impact)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "tree-sitter>=0.23", "tree-sitter-java>=0.23", "tree-sitter-go>=0.23", "tree-sitter-c-sharp>=0.23",
                "tree-sitter-kotlin>=1.0", "tree-sitter-typescript>=0.23", "tree-sitter-javascript>=0.23",
                # the structural adapter's 39 grammars (tia/lang/generic.py), bundled in the wheel; 1.x downloads grammars at run time
                "tree-sitter-language-pack==0.13.0",
                "cryptography>=42"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "httpx", "uvicorn", "python-multipart", "signxml>=4", "lxml>=5"]
neo4j = ["neo4j>=5.20"]                                  # the Neo4j mirror for Knowledge Fabric (docs/NEO4J.md)
dev = ["pytest", "pgserver", "neo4j>=5.20"]

[project.scripts]
tia = "tia.cli:main"

[tool.setuptools]
packages = ["tia", "tia.lang"]      # tia.lang holds the Go, C#, Kotlin, TypeScript and structural adapters

[tool.setuptools.package-data]
tia = ["web/*.html", "web/vendor/*", "migrations/*.sql"]

