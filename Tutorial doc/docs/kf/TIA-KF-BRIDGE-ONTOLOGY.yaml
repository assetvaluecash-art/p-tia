# Generated by tools/gen_kf_ontology.py from tia/kfontology.py; do not edit by hand (a test fails when it is out of date).
# Also served at GET /api/v1/graph/ontology. See docs/KF-BRIDGE.md section 5.
name: tia-kf-bridge
version: kb-3
lane: bridge
description: The only relationships between TIA's software graph and Knowledge Fabric's business graph. Always from a TIA node to a Knowledge
  Fabric node, confined to one Knowledge Fabric customer; carry bridge=true, owner=tia, the evidence status and both sides' versions.
edge_properties:
- bridge
- owner
- tenant
- kf_customer_id
- kf_tenant_id
- domain
- status
- strategy
- rule
- source
- id_check
- tia_graph_version
- kf_fingerprint
- bridge_version
- linked_at
- product_line
- product_line_id
- level
- decided_by
- decided_at
relationship_types:
- name: REALIZES
  allowed_triples:
  - from: TiaService
    to: System
  planned: false
  written: true
  decided_by: declared alias (tenant setting knowledge_fabric.system_aliases, or business_systems in tia-services.yaml); otherwise the exact Knowledge
    Fabric key of the service or repository name
  evidence:
    declared: contract_confirmed
    name: inferred (INF-KF-NAME)
  description: 'The service''s code realises the named system (ArchiMate realization: an application component realises a business-facing system).'
- name: SAME_AS
  allowed_triples:
  - from: TiaTestCase
    to: TestCase
  planned: false
  written: true
  decided_by: the same test case id under Knowledge Fabric's normalisation
  evidence:
    test_case_id: source_confirmed
  description: The written test case in a repository and the Knowledge Fabric test case are the same test case.
- name: REALIZES
  allowed_triples:
  - from: TiaScreen
    to: FormCapture
  planned: false
  written: true
  decided_by: declared alias (knowledge_fabric.screen_aliases by route or component, or business_screens in tia-services.yaml); otherwise the
    exact Knowledge Fabric key of the component or of the route's last segment
  evidence:
    declared: contract_confirmed
    name: inferred (INF-KF-NAME)
  description: The screen realises the form or screen the documents describe.
- name: STORES
  allowed_triples:
  - from: TiaEntity
    to: DataEntity
  planned: false
  written: true
  decided_by: declared alias (knowledge_fabric.data_aliases, or business_data in tia-services.yaml); otherwise the exact key of the class name,
    or of the class name without a technical suffix (Record, Entity, Model, Dto, View, Row)
  evidence:
    declared: contract_confirmed
    name: inferred (INF-KF-NAME)
  description: The ORM entity stores the business data entity.
- name: STORES
  allowed_triples:
  - from: TiaTable
    to: DataEntity
  planned: false
  written: true
  decided_by: declared alias; otherwise the exact key of the table name or of its singular
  evidence:
    declared: contract_confirmed
    name: inferred (INF-KF-NAME)
  description: The table stores the business data entity.
- name: ENFORCES
  allowed_triples:
  - from: TiaRule
    to: Rule
  planned: false
  written: true
  decided_by: a person confirms a pair TIA proposed (shared field names, then word overlap); rule names are sentences, so names alone never link
  evidence:
    confirmed: contract_confirmed
  description: The rule found in code enforces the business rule.
- name: PLACED_IN
  allowed_triples:
  - from: TiaService
    to: ProductLine
  planned: false
  written: true
  decided_by: 'a person: tenant setting knowledge_fabric.repository_products / service_products, business_products in tia-services.yaml, or a
    reviewer accepting a suggestion (a suggestion from the linked Systems is never applied by itself)'
  evidence:
    declared: contract_confirmed
    reviewed: contract_confirmed
  description: The service belongs to this ProductLine of the customer's business tree (domain > product line > function > sub-function); every
    impact of the service rolls up the tree from here. Carries product_line_id, because one function can sit under two product lines.
- name: PLACED_IN
  allowed_triples:
  - from: TiaService
    to: Function
  planned: false
  written: true
  decided_by: 'a person: tenant setting knowledge_fabric.repository_products / service_products, business_products in tia-services.yaml, or a
    reviewer accepting a suggestion (a suggestion from the linked Systems is never applied by itself)'
  evidence:
    declared: contract_confirmed
    reviewed: contract_confirmed
  description: The service belongs to this Function of the customer's business tree (domain > product line > function > sub-function); every impact
    of the service rolls up the tree from here. Carries product_line_id, because one function can sit under two product lines.
- name: PLACED_IN
  allowed_triples:
  - from: TiaService
    to: SubFunction
  planned: false
  written: true
  decided_by: 'a person: tenant setting knowledge_fabric.repository_products / service_products, business_products in tia-services.yaml, or a
    reviewer accepting a suggestion (a suggestion from the linked Systems is never applied by itself)'
  evidence:
    declared: contract_confirmed
    reviewed: contract_confirmed
  description: The service belongs to this SubFunction of the customer's business tree (domain > product line > function > sub-function); every
    impact of the service rolls up the tree from here. Carries product_line_id, because one function can sit under two product lines.
- name: IMPLEMENTS_CHANGE
  allowed_triples:
  - from: TiaChange
    to: UserStory
  planned: false
  written: false
  decided_by: an issue key (PAY-4521) in a commit message of the change that Knowledge Fabric keeps as the user story's name or alias
  evidence:
    issue_key: source_confirmed
  description: 'The change implements the user story. Reported in the analysis (business_impact.user_stories), not stored in Neo4j: a change is
    an analysis, not a node of the mirror.'
