- name: System
  layer: technical
  description: 'A named, deployable banking software platform, application, integration system, or named API service — something
    you can install, configure, or connect to. Valid examples: Temenos Transact, Murex, Finastra TI+, Kondour, Payment Hub,
    Online Banking Portal, Mobile Banking App, SWIFT Gateway, SMS Gateway, Statement Generation System, Core Banking System,
    LOS_Core, Actimize AML, Loan API. From TechnicalSpec API catalogs, extract the named API or service (Loan API from LOAN.API.3),
    not the operation. NOT HTTP methods, NOT operationIds, NOT REST paths, NOT accounting transaction codes, NOT customer
    types, NOT generic module references without a product name.'
  name_pattern: Title Case, proper product name ≤80 chars
  ie_examples:
  - block_text: The payment hub integrates with Temenos Transact for account validation, SWIFT Gateway for cross-border message
      transmission, and the SMS Gateway for customer notifications. Finastra TI+ handles treasury deal processing and feeds
      position data to Murex for risk calculation.
