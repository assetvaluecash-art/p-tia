      confidence: 0.85
    relationships:
    - from_type: Defect
      from_value: DEF-2024-0567
      rel_type: LINKED_TO
      to_type: Incident
      to_value: INC-LOAN-089
    - from_type: Incident
      from_value: INC-LOAN-089
      rel_type: IMPACTS
