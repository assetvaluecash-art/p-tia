relationship_types:
- name: PART_OF
  description: Structural containment in the pre-seeded business spine. Never generate a spine edge from document
    prose.
  examples:
  - The source explicitly supports the PART_OF edge and both endpoints.
  anti_examples:
  - Do not infer containment from co-occurrence.
- name: IMPLEMENTS
  description: A user story explicitly delivers or realizes a requirement.
  examples:
  - The member-portal user story is explicitly delivered by the authorization-status requirement.
  anti_examples:
  - Shared topic or same release alone does not establish implementation.
- name: COVERS
  description: A test case explicitly verifies a requirement.
  examples:
  - The prior-authorization status test verifies the stated portal requirement.
  anti_examples:
  - A test mentioning the same feature is not coverage without verification intent.
- name: VALIDATES
  description: Acceptance criteria explicitly provides a condition that verifies a requirement.
  examples:
  - The Given/When/Then care-queue criterion verifies the care-action-view requirement.
  anti_examples:
  - Do not reverse the endpoints or infer validation from a general goal.
- name: IMPACTS
  description: The source explicitly states that one artifact affects the target artifact or behavior.
  examples:
  - The authorization-status requirement changes the Prior Authorization Review process.
  anti_examples:
  - Do not infer impact solely because two items share a domain or product line.
- name: GOVERNED_BY
  description: A process is explicitly governed by a named rule or operational control.
  examples:
  - The source states that the prior-authorization workflow must follow the named documentation-routing rule.
  anti_examples:
  - Do not attach every rule/control in a document to every process.
- name: USES
  description: A process explicitly uses or invokes a named system/service.
  examples:
  - The claim-adjudication process invokes the Claims Adjudication Platform.
  anti_examples:
  - Mentioning a system elsewhere in the block does not prove usage.
- name: VIOLATES
  description: A recorded defect is explicitly stated to breach a requirement or acceptance criterion.
  examples:
  - The defect states that the implementation breaches the claim eligibility requirement.
  anti_examples:
  - A defect and requirement appearing in the same section is insufficient.
- name: MISSED_BY
  description: A defect is explicitly associated with a test case that failed to detect it.
  examples:
  - The defect record says test TC-CLM-011 failed to detect the renewal-date rejection.
  anti_examples:
  - Do not attach all tests to a defect.
- name: LINKED_TO
  description: The source explicitly links a defect with an incident record.
  examples:
  - The incident record explicitly links the member-portal defect to INC-CARE-006.
  anti_examples:
  - Similar titles or dates alone do not establish a link.
- name: PRODUCES
  description: A process explicitly creates or emits a named business data object.
  examples:
  - Health Claim Adjudication creates an Explanation of Benefits record.
  anti_examples:
  - Do not infer output from a system name alone.
- name: CROSS_DOMAIN_IMPACTS
  description: The source explicitly states that one process in another domain is affected.
  examples:
  - The care-management process explicitly affects a claims-operation process in another domain.
  anti_examples:
  - Do not create cross-domain edges from a general downstream possibility.
- name: PERFORMS
  description: A role or team explicitly performs a process.
  examples:
  - The Claims Examiner performs Health Claim Adjudication.
  anti_examples:
  - Do not infer the actor from organizational convention.
- name: MITIGATES
  description: A control is explicitly designed to reduce a process or rule risk.
  examples:
  - Authorization Evidence Check reduces the risk in Prior Authorization Review.
  anti_examples:
  - A control and rule in one paragraph are not automatically linked.
- name: ENFORCED_BY
  description: A rule or control is explicitly tied to an external regulation or instrument that enforces it.
  examples:
  - The stated authorization control is explicitly tied to a named external instrument.
  anti_examples:
  - Do not attach regulations based only on a shared compliance topic.
- name: COMPLIANT_WITH
  description: A process is explicitly stated to comply with a named external regulation/standard.
  examples:
  - The source explicitly states that the payer authorization process complies with CMS-0057-F.
  anti_examples:
  - Do not assert compliance merely because the regulation is cited.
- name: INTEGRATES_WITH
  description: The source explicitly describes an interface or data exchange between two named systems.
  examples:
  - The named EHR sends encounter data through a described interface to the claims platform.
  anti_examples:
  - Coexistence in an architecture diagram is not sufficient without a connection.
