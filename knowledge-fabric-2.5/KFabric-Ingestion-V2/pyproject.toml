[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbfabric-ingest"
version = "1.0.0"
description = "KnowledgeFabric Ingestion Service - Document Ingestion with Ray Integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "KnowledgeFabric Team"}
]
keywords = ["ingestion", "rag", "ray", "weaviate", "neo4j", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "ray[default]>=2.9.0",
    "weaviate-client>=3.25.0",
    "neo4j>=5.14.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "python-docx>=1.0.0",
    "pypdf>=3.17.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "Pillow>=10.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "faker>=20.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "structlog>=23.2.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]

[project.scripts]
kbfabric-ingest = "kbfabric_ingest.scheduler.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbfabric_ingest*", "custom_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

